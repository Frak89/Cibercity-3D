  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#ecfcff;touch-action:none}

) col += nA * 0.22;\n    } else {\n        float density = 0.22 + 0.5 * fract(seed * 3.71);\n        vec2 cs = kind > 1.5 ? vec2(1.25, 1.5) : vec2(1.9, 2.7);\n        vec2 q = vUV / cs;\n        vec2 c = floor(q);\n        vec2 f = fract(q);\n        float m = step(0.16, f.x) * step(f.x, 0.84) * step(0.24, f.y) * step(f.y, 0.80);\n        float r = h21(c * 0.731 + vec2(id * 1.37, floor(dot(vN, vec3(3.0, 0.0, 7.0)) + 0.5) * 11.0));\n        float lit = step(1.0 - density, r);\n        float flick = h21(c + vec2(floor(uTime * 0.08 + r * 20.0), id));\n        lit *= step(0.035, flick);\n        float pal = fract(r * 13.7 + seed);\n        vec3 wc = pal < 0.62 ? uWinA : (pal < 0.86 ? uWinB : uWinC);\n        wc *= 0.5 + 0.9 * fract(r * 91.1);\n        // whole lit floors (offices)\n        float floorLit = step(0.93, h21(vec2(c.y * 1.3, id)));\n        vec3 detail = base + m * max(lit, floorLit) * wc;\n        float lod = smoothstep(55.0, 210.0, vDist);\n        vec3 far = base + wc * density * 0.30;\n        col = mix(detail, far, lod);\n        col *= 0.7 + 0.3 * smoothstep(0.0, top, vWP.y);\n        if (kind > 0.5) {\n            float e = min(vUV.x, fw - vUV.x);\n            float pulse = 0.78 + 0.22 * sin(uTime * 2.0 + seed * 10.0);\n            col += nA * (exp(-e * 2.2) * 0.9 + exp(-max(0.0, top - vWP.y) * 1.1) * 1.5) * pulse;\n            float band = exp(-abs(fract(vWP.y / 23.0 + seed) - 0.5) * 70.0);\n            col += nA * band * 0.7 * step(0.45, fract(seed * 5.1));\n        }\n        // street-level shop glow\n        col += mix(uNeonA, uWinA, fract(seed * 9.0)) * exp(-vWP.y * 0.22) * 0.55;\n    }\n    col = applyFog(col, vDist, vWP.y);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "building.vert": "attribute vec3 aPos;\nattribute vec2 aCenter;\nattribute vec3 aNorm;\nattribute vec2 aUV;\nattribute vec4 aMisc;\nuniform mat4 uVP;\nuniform vec3 uEye;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;   // game: camera position on the torus world\nuniform float uWrapX;  // > 0: wrap x too (game world), 0: no x wrap (screensaver)\nuniform float uZOff;   // where the z wrap seam sits (0.08 screensaver, 0.5 game)\nvarying vec3 vN;\nvarying vec2 vUV;\nvarying vec4 vMisc;\nvarying vec3 vWP;\nvoid main(){\n    float z = mod(aCenter.y - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    float x = uWrapX > 0.0 ? mod(aCenter.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5 : aCenter.x;\n    vec3 wp = vec3(x, 0.0, z) + aPos;\n    vN = aNorm; vUV = aUV; vMisc = aMisc; vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "car.frag": "varying vec2 vC;\nvarying float vAway;\nvarying float vDist;\nvarying float vSeed;\nvoid main(){\n    float side = exp(-vC.y * vC.y * 3.5);\n    float along = mix(0.25, 1.0, vC.x);\n    vec3 tailCol = vec3(1.0, 0.12, 0.18);\n    vec3 headCol = mix(vec3(0.85, 0.95, 1.0), uNeonA, step(0.8, fract(vSeed * 13.0)));\n    vec3 col = mix(headCol, tailCol, vAway);\n    col += vec3(1.0) * pow(vC.x, 8.0) * 0.6;\n    float fade = 1.0 - fogAmount(vDist) * 0.85;\n    gl_FragColor = vec4(col * side * along * fade * 1.3, 1.0);\n}\n", "car.vert": "attribute vec4 aLane;   // origin x, y, z, speed (m/s)\nattribute vec4 aDir;    // dir x, dir z, trail length, seed\nattribute vec2 aCorner; // x: 0 = tail, 1 = head ; y: side -1..1\nuniform mat4 uV;\nuniform mat4 uP;\nuniform vec3 uEye;\nuniform float uTime;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;   // game: camera position on the torus world\nuniform float uWrapX;  // > 0: wrap x too (game world), 0: no x wrap (screensaver)\nuniform float uZOff;   // where the z wrap seam sits (0.08 screensaver, 0.5 game)\nuniform float uWidth;\nvarying vec2 vC;\nvarying float vAway;\nvarying float vDist;\nvarying float vSeed;\nvoid main(){\n    vec3 d = vec3(aDir.x, 0.0, aDir.y);\n    float p = mod(aDir.w * 977.0 + aLane.w * uTime, 2.0 * uL);\n    vec3 head = aLane.xyz + d * p;\n    head.x = mod(head.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5;\n    head.z = mod(head.z - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    head.y += sin(uTime * 0.7 + aDir.w * 50.0) * 0.4;\n    vec3 tail = head - d * aDir.z;\n    vec3 h = (uV * vec4(head, 1.0)).xyz;\n    vec3 t = (uV * vec4(tail, 1.0)).xyz;\n    vec3 seg = h - t;\n    vec3 P = mix(t, h, aCorner.x);\n    vec3 perp = cross(seg, P);\n    float pl = length(perp);\n    perp = pl > 1e-4 ? perp / pl : vec3(1.0, 0.0, 0.0);\n    float sl = length(seg);\n    vec3 sdir = sl > 1e-4 ? seg / sl : vec3(0.0, 1.0, 0.0);\n    float w = uWidth * (1.0 + 0.004 * length(P));\n    P += perp * aCorner.y * w + sdir * (aCorner.x * 2.0 - 1.0) * w;\n    vC = aCorner;\n    vAway = step(0.0, dot(d, head - uEye));\n    vDist = length(head - uEye);\n    vSeed = aDir.w;\n    gl_Position = uP * vec4(P, 1.0);\n}\n", "car_hd.frag": "uniform float uKey;        // key light strength (studio > street)\nuniform float uGlassPass;  // 1 while drawing the transparent glass\nuniform float uLights;     // headlights / tail lights on\nuniform float uBrake;\nuniform float uSpd;        // live data for the instrument cluster: km/h\nuniform float uRpmK;       // rpm / limiter\nuniform float uGear;       // -2 E, -1 N, 0.. gear index\nuniform float uFuelK;      // tank 0..1\nuniform float uGx;         // longitudinal g\n/* 7-segment digit d in a 1\u00d72 cell (p in 0..1 \u00d7 0..2) */\nfloat seg7(vec2 p, float d){\n    float on = 0.0;\n    // segments a b c d e f g as bit flags of the digit\n    float bits = d < 0.5 ? 63.0 : d < 1.5 ? 6.0 : d < 2.5 ? 91.0 : d < 3.5 ? 79.0 : d < 4.5 ? 102.0 : d < 5.5 ? 109.0 : d < 6.5 ? 125.0 : d < 7.5 ? 7.0 : d < 8.5 ? 127.0 : d < 9.5 ? 111.0 : 121.0;  // 10 = E\n    float w = 0.16;\n    float a = step(abs(p.y - 1.9), w) * step(abs(p.x - 0.5), 0.36);\n    float g = step(abs(p.y - 1.0), w) * step(abs(p.x - 0.5), 0.36);\n    float dd = step(abs(p.y - 0.1), w) * step(abs(p.x - 0.5), 0.36);\n    float f = step(abs(p.x - 0.1), w) * step(abs(p.y - 1.45), 0.42);\n    float b = step(abs(p.x - 0.9), w) * step(abs(p.y - 1.45), 0.42);\n    float e = step(abs(p.x - 0.1), w) * step(abs(p.y - 0.55), 0.42);\n    float c = step(abs(p.x - 0.9), w) * step(abs(p.y - 0.55), 0.42);\n    on += a * mod(bits, 2.0);\n    on += b * mod(floor(bits / 2.0), 2.0);\n    on += c * mod(floor(bits / 4.0), 2.0);\n    on += dd * mod(floor(bits / 8.0), 2.0);\n    on += e * mod(floor(bits / 16.0), 2.0);\n    on += f * mod(floor(bits / 32.0), 2.0);\n    on += g * mod(floor(bits / 64.0), 2.0);\n    return clamp(on, 0.0, 1.0);\n}\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec2 vUV;\nvarying vec3 vCol;\nvarying vec4 vPar;\n\n/* Procedural PBR-ish car materials: carbon twill, stitched leather, tyre tread, drilled discs, HUD screens, LED lights, grille. */\nvoid main(){\n    vec3 v = normalize(uEye - vWP);\n    vec3 n = normalize(vN);\n    if (dot(n, v) < 0.0) n = -n;\n    float rough = vPar.x, metal = vPar.y, em = vPar.z, pat = vPar.w;\n    vec3 base = vCol;\n    vec2 uv = vUV;\n    float emis = em;\n    if (pat > 0.5 && pat < 1.5) {            // carbon fibre twill\n        vec2 q = uv * 60.0;\n        float a = mod(floor(q.x) + floor(q.y), 2.0);\n        float w = abs(fract(a > 0.5 ? q.x : q.y) - 0.5);\n        base *= 0.55 + 0.9 * (0.4 + 0.6 * w) * (0.7 + 0.3 * a);\n        rough = mix(rough, 0.15, a * 0.5);\n    } else if (pat > 1.5 && pat < 2.5) {     // leather: grain + accent stitching\n        float g = h21(floor(uv * 260.0)) * 0.12;\n        base *= 0.9 + g;\n        float st = (1.0 - smoothstep(0.0, 0.04, abs(fract(uv.y * 6.0) - 0.5))) * step(0.5, fract(uv.x * 90.0));\n        base = mix(base, uNeonB * 0.9, st * 0.8);\n    } else if (pat > 2.5 && pat < 3.5) {     // tyre: tread blocks on the crown, lettering band on the sidewall\n        float crown = smoothstep(0.30, 0.38, uv.y) * (1.0 - smoothstep(0.62, 0.70, uv.y));\n        float groove = step(0.82, fract(uv.x + (uv.y - 0.5) * 3.0)) + step(0.92, fract(uv.y * 5.0));\n        base *= 1.0 - crown * clamp(groove, 0.0, 1.0) * 0.7;\n        float side = 1.0 - crown;\n        float letters = side * step(0.6, h21(vec2(floor(uv.x * 12.0), floor(uv.y * 9.0)))) * step(0.12, uv.y) * step(uv.y, 0.22);\n        base += vec3(0.08) * letters;\n        rough = 0.9;\n    } else if (pat > 3.5 && pat < 4.5) {     // displays: uv.x 0..1 instrument cluster, 2..3 navigation map\n        float scan = 0.9 + 0.1 * sin(uv.y * 400.0);\n        vec3 c = vec3(0.004, 0.008, 0.015);\n        if (uv.x < 1.5) {\n            vec2 q = vec2(uv.x * 4.2, uv.y);                       // display is ~4:1\n            for (int g = 0; g < 2; g++) {                          // tachometer (left) and speed (right) dials\n                vec2 cc = vec2(g == 0 ? 0.85 : 3.35, 0.5), d = q - cc;\n                float r = length(d), a = atan(d.x, -d.y);           // 0 at the bottom\n                float val = g == 0 ? clamp(uRpmK, 0.0, 1.0) : clamp(uSpd / 360.0, 0.0, 1.0);\n                float ang = (a + 3.14159) / 6.28318;\n                float arc = smoothstep(0.04, 0.0, abs(r - 0.40)) * step(0.12, ang) * step(ang, 0.88);\n                float lit = arc * step(ang, 0.12 + 0.76 * val);\n                float tick = smoothstep(0.03, 0.0, abs(r - 0.33)) * step(0.85, fract(ang * 20.0)) * step(0.12, ang) * step(ang, 0.88);\n                float red = step(0.75, ang);\n                c += uNeonA * arc * 0.18 + mix(uNeonA, vec3(1.0, 0.15, 0.25), red) * lit * 0.9 + vec3(0.6) * tick * 0.5;\n                c += uNeonA * smoothstep(0.30, 0.0, r) * 0.08;\n            }\n            // centre: live speed (3 digits), gear, fuel bar, g-meter\n            float spd = floor(clamp(uSpd, 0.0, 999.0) + 0.5);\n            for (int k = 0; k < 3; k++) {\n                float dv = k == 0 ? floor(spd / 100.0) : k == 1 ? floor(mod(spd, 100.0) / 10.0) : mod(spd, 10.0);\n                vec2 cp = (q - vec2(1.62 + float(k) * 0.30, 0.30)) / vec2(0.25, 0.25);\n                if (cp.x > 0.0 && cp.x < 1.0 && cp.y > 0.0 && cp.y < 2.0 && (k > 0 || spd >= 100.0) && (k > 1 || spd >= 10.0)) c += vec3(0.85, 0.95, 1.0) * seg7(cp, dv) * 1.2;\n            }\n            float gd = uGear < -1.5 ? 10.0 : uGear < -0.5 ? 0.0 : uGear + 1.0;\n            vec2 gp = (q - vec2(1.95, 0.05)) / vec2(0.12, 0.12);\n            if (gp.x > 0.0 && gp.x < 1.0 && gp.y > 0.0 && gp.y < 2.0) c += uNeonB * seg7(gp, gd) * 1.3;\n            float fb = step(abs(q.y - 0.92), 0.03) * step(1.6, q.x) * step(q.x, 1.6 + 0.9 * clamp(uFuelK, 0.0, 1.0));\n            c += mix(vec3(1.0, 0.2, 0.2), uNeonA, step(0.15, uFuelK)) * fb * 0.9 + vec3(0.12) * step(abs(q.y - 0.92), 0.03) * step(1.6, q.x) * step(q.x, 2.5);\n            float gx = clamp(uGx, -1.5, 1.5);\n            c += uNeonA * smoothstep(0.03, 0.0, abs(q.x - (2.75 + 0.02 * 0.0))) * step(abs(q.y - 0.5 - gx * 0.25), 0.05) * 1.5;\n        } else {\n            vec2 q = vec2(uv.x - 2.0, uv.y) * vec2(3.0, 2.0) + vec2(uTime * 0.05, uTime * 0.12);\n            vec2 gr = abs(fract(q * 3.0) - 0.5);\n            float road = smoothstep(0.06, 0.0, min(gr.x, gr.y));\n            c += vec3(0.05, 0.07, 0.1) * road;\n            float route = smoothstep(0.05, 0.0, abs(fract(q.x * 3.0 + 0.5) - 0.5)) * step(0.5, fract(q.y * 1.5));\n            c += uNeonB * route * 0.6;\n            vec2 me = vec2(uv.x - 2.5, uv.y - 0.35);\n            c += uNeonA * smoothstep(0.05, 0.02, length(me * vec2(3.0, 2.0)));\n        }\n        base = c * scan;\n        emis = 1.0;\n    } else if (pat > 4.5 && pat < 5.5) {     // drilled + slotted brake disc\n        vec2 q = vec2(uv.x * 48.0, uv.y * 3.0);\n        float hole = 1.0 - smoothstep(0.18, 0.24, length(fract(q) - 0.5));\n        base *= 1.0 - hole * 0.85;\n        base += vec3(0.04) * step(0.97, fract(uv.x * 12.0 + uv.y));\n    } else if (pat > 5.5 && pat < 6.5) {     // segmented tail light bar\n        float seg = step(0.18, fract(uv.x * 46.0));\n        emis = em * seg * (uLights * 0.8 + uBrake * 1.6 + 0.15);\n    } else if (pat > 6.5 && pat < 7.5) {     // LED headlight dots\n        vec2 q = fract(uv * vec2(90.0, 30.0)) - 0.5;\n        float led = 1.0 - smoothstep(0.2, 0.35, length(q));\n        base = mix(base * 0.35, base, led);\n        emis = em * (0.25 + 0.95 * uLights) * (0.4 + 0.6 * led);\n    } else if (pat > 7.5 && pat < 8.5) {     // hexagonal grille\n        vec2 q = uv * vec2(60.0, 34.0);\n        q.x += step(1.0, mod(floor(q.y), 2.0)) * 0.5;\n        float hex = smoothstep(0.32, 0.4, length(fract(q) - 0.5));\n        base *= 0.15 + 0.85 * hex;\n    } else if (pat > 8.5 && pat < 9.5) {     // neon: gentle pulse\n        emis = em * (0.85 + 0.15 * sin(uTime * 2.2 + vWP.x * 2.0));\n    } else if (pat > 10.5) {                 // titanium: heat-tinted (gold \u2192 blue \u2192 violet) along the pipe\n        float k = clamp(uv.x, 0.0, 1.0);\n        vec3 heat = 0.5 + 0.5 * cos(6.28318 * (vec3(0.0, 0.33, 0.67) + k * 0.9 + 0.15));\n        base = mix(base, heat * 0.7, 0.55 * smoothstep(0.1, 0.9, k));\n    } else if (pat > 9.5) {                  // carpet\n        base *= 0.8 + 0.3 * h21(floor(uv * 400.0));\n    }\n    vec3 L = normalize(vec3(0.35, 0.8, 0.45));\n    float diff = max(dot(n, L), 0.0);\n    vec3 amb = uFog * 0.7 + uSkyTop * 0.6 + vec3(0.035) + (n.y * 0.5 + 0.5) * vec3(0.05, 0.05, 0.07);\n    amb += uKey * 0.22 * (n.y * 0.5 + 0.5) + uKey * 0.08;            // soft studio / street fill\n    vec3 r = reflect(-v, n);\n    float band = smoothstep(0.75, 1.0, sin(r.x * 9.0 + r.z * 5.0 + r.y * 3.0) * 0.5 + 0.5);\n    vec3 env = mix(uFog * 1.2 + vec3(0.02), uSkyTop * 1.4 + vec3(0.05, 0.06, 0.09), smoothstep(-0.3, 0.6, r.y));\n    env += mix(uNeonA, uNeonB, step(0.0, r.x)) * band * 0.55 + vec3(0.9, 0.85, 0.8) * smoothstep(0.985, 1.0, dot(r, L)) * 2.0;\n    env += vec3(0.85, 0.9, 1.0) * uKey * 0.5 * smoothstep(0.75, 0.9, r.y) * (0.6 + 0.4 * step(0.5, fract(r.x * 2.5 + 0.25)));  // overhead softboxes\n    // crisp horizon line: dark floor below, bright rim just above \u2014 gives the body its \"liquid\" definition\n    env = mix(env * 0.35, env, smoothstep(-0.02, 0.02, r.y));\n    env += vec3(0.55, 0.6, 0.75) * (uKey * 0.6 + 0.25) * smoothstep(0.0, 0.03, r.y) * (1.0 - smoothstep(0.03, 0.12, r.y));\n    // long side softbox strip\n    env += vec3(1.0) * uKey * 0.45 * smoothstep(0.86, 0.9, abs(r.x)) * smoothstep(0.05, 0.15, r.y) * (1.0 - smoothstep(0.35, 0.45, r.y));\n    float ndv = max(dot(n, v), 0.0);\n    float fres = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);\n    vec3 F0 = mix(vec3(0.04), base, metal);\n    float shin = mix(220.0, 6.0, rough);\n    float spec = pow(max(dot(reflect(-L, n), v), 0.0), shin) * (1.0 - rough) * 1.6;\n    // cheap ambient occlusion: darker toward the ground, the sills and inside the wheel arches\n    float ao = 0.45 + 0.55 * smoothstep(0.12, 0.62, vWP.y);\n    vec3 col = base * (1.0 - metal) * (amb + diff * uKey * 0.9) * ao;\n    col += env * mix(vec3(fres), base, metal) * (1.0 - rough * 0.8);\n    col += spec * mix(vec3(1.0), base, metal) * uKey;\n    // clear coat on painted panels: a second, razor-sharp lobe on top of the base paint\n    if (pat < 0.5 && rough < 0.5 && uGlassPass < 0.5) {\n        float cc = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);\n        col += env * cc * 0.9 * ao;\n        col += vec3(1.0) * pow(max(dot(reflect(-L, n), v), 0.0), 900.0) * 3.0 * uKey;\n    }\n    col += base * emis * 2.4;\n    col += vec3(0.6, 0.65, 0.8) * uFlash * 0.25;\n    col = applyFog(col, length(uEye - vWP), vWP.y);\n    float alpha = 1.0;\n    if (uGlassPass > 0.5) {                  // tinted glass: you see the cabin, but it clearly is a closed coup\u00e9\n        col = col * 0.8 + env * (0.10 + fres * 0.9);\n        alpha = clamp(0.48 + 0.5 * fres + spec * 0.5, 0.0, 0.95);\n    }\n    gl_FragColor = vec4(col, alpha);\n}\n", "car_hd.vert": "attribute vec3 aPos;\nattribute vec3 aNorm;\nattribute vec2 aUV;\nattribute float aMat;\nuniform mat4 uVP;\nuniform mat4 uModel;\nuniform vec3 uMatCol[24];\nuniform vec4 uMatPar[24];   // roughness, metalness, emissive, pattern id\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec2 vUV;\nvarying vec3 vCol;\nvarying vec4 vPar;\nvoid main(){\n    int m = int(aMat + 0.5);\n    vCol = uMatCol[m];\n    vPar = uMatPar[m];\n    vec4 wp = uModel * vec4(aPos, 1.0);\n    vWP = wp.xyz;\n    vN = (uModel * vec4(aNorm, 0.0)).xyz;\n    vUV = aUV;\n    gl_Position = uVP * wp;\n}\n", "common.glsl": "#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nuniform float uTime;\nuniform float uL;\nuniform float uFar;    // distance where everything has faded into the fog\nuniform float uFogDen;\nuniform vec3 uEye;\nuniform vec3 uFog;\nuniform vec3 uSkyTop;\nuniform vec3 uWinA;\nuniform vec3 uWinB;\nuniform vec3 uWinC;\nuniform vec3 uNeonA;\nuniform vec3 uNeonB;\nuniform float uFlash;   // lightning\n\nfloat h21(vec2 p){\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nfloat vnoise(vec2 p){\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));\n    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\nfloat fbm(vec2 p){\n    float v = 0.0, a = 0.5;\n    for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }\n    return v;\n}\n\n/* Integer id from an interpolated per-vertex seed: varyings are not bit-exact,\n   so hashing the raw float produces per-pixel noise. */\nfloat sid(float s){ return floor(s * 251.0 + 0.5); }\n\n/* Exponential fog plus a hard fade near the end of the wrapped city chunk,\n   so buildings re-entering at the horizon never pop. */\nfloat fogAmount(float d){\n    float f = 1.0 - exp(-d * uFogDen);\n    return max(f, smoothstep(uFar * 0.60, uFar * 0.84, d));\n}\nvec3 applyFog(vec3 col, float d, float y){\n    float f = fogAmount(d);\n    vec3 fc = uFog * (1.0 + 0.35 * exp(-max(y, 0.0) * 0.02)) + vec3(0.55, 0.6, 0.8) * uFlash;\n    return mix(col, fc, f);\n}\n\n/* headlight beams on the ground: uHL = (nose x, nose z, forward x, forward z) in the frame of vWP */\nuniform vec4 uHL;\nuniform float uHLOn;\nvec3 headLight(vec3 wp){\n    if (uHLOn < 0.01) return vec3(0.0);\n    vec2 d = wp.xz - uHL.xy, f = normalize(uHL.zw + 1e-6), r = vec2(-f.y, f.x);\n    float along = dot(d, f), lat = dot(d, r), w = 0.45 + max(along, 0.0) * 0.26;\n    float cone = max(smoothstep(w, 0.0, abs(lat - 0.62)), smoothstep(w, 0.0, abs(lat + 0.62)));\n    float fall = smoothstep(0.3, 3.5, along) * exp(-max(along, 0.0) * 0.032) * (1.0 - smoothstep(55.0, 85.0, along));\n    float pool = exp(-dot(d - f * 2.2, d - f * 2.2) * 0.35) * 0.35;           // spill right in front of the bumper\n    return vec3(1.0, 0.95, 0.86) * (cone * fall * 1.25 + pool) * uHLOn;\n}\n", "glow.frag": "uniform float uGlow;\nvarying vec2 vUV;\nvarying vec4 vCol;\nvarying vec3 vWP;\n/* Additive soft light: underglow, headlight pools, tail-light bloom. */\nvoid main(){\n    float f = exp(-dot(vUV, vUV) * 2.6) * (1.0 - smoothstep(0.85, 1.0, max(abs(vUV.x), abs(vUV.y))));\n    float d = length(uEye - vWP);\n    float fade = 1.0 - fogAmount(d) * 0.9;\n    gl_FragColor = vec4(vCol.rgb * f * vCol.a * uGlow * fade, 1.0);\n}\n", "glow.vert": "attribute vec3 aPos;\nattribute vec2 aUV;\nattribute vec4 aCol;\nuniform mat4 uVP;\nuniform mat4 uModel;\nvarying vec2 vUV;\nvarying vec4 vCol;\nvarying vec3 vWP;\nvoid main(){\n    vec4 wp = uModel * vec4(aPos, 1.0);\n    vWP = wp.xyz; vUV = aUV; vCol = aCol;\n    gl_Position = uVP * wp;\n}\n", "ground.frag": "uniform float uCamZ;\nvarying vec3 vWP;\n\nvoid main(){\n    float vDist = length(vWP - uEye); // per-pixel: interpolating it across big quads is wrong\n    float wz = vWP.z + uCamZ;\n    float ax = abs(vWP.x);\n    vec3 col = vec3(0.010, 0.012, 0.018);\n    // dashed lane lines on the avenue\n    float lane = (1.0 - smoothstep(0.05, 0.16, abs(mod(vWP.x + 2.0, 4.0) - 2.0)))\n               * step(ax, 13.0) * step(0.55, fract(wz / 6.0));\n    col += vec3(0.55, 0.58, 0.7) * lane * 0.18;\n    // sidewalk curbs glow\n    col += uNeonA * exp(-abs(ax - 14.5) * 3.0) * 0.35;\n    // cross streets\n    float cz = abs(mod(wz, 84.0) - 7.0);\n    float cross = step(cz, 6.0);\n    col += vec3(0.6, 0.6, 0.7) * cross * step(0.6, fract(vWP.x / 5.0)) * 0.05 * step(ax, 400.0);\n    // wet asphalt: vertical streak reflections of the neon\n    float n = h21(vec2(floor(vWP.x * 0.7), 3.0));\n    float streak = pow(n, 5.0) * (0.55 + 0.45 * sin(wz * 0.045 + n * 40.0 + uTime * 0.3));\n    col += mix(uNeonA, uNeonB, fract(n * 7.0)) * streak * 0.55 * (0.6 + 0.4 * step(13.0, ax));\n    // reflection of the fog / skyline\n    col += uFog * 0.12 * smoothstep(20.0, 300.0, vDist);\n    col = applyFog(col, vDist * 0.7, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "ground.vert": "attribute vec2 aPos;\nuniform mat4 uVP;\nuniform vec3 uEye;\nvarying vec3 vWP;\nvoid main(){\n    vec3 wp = vec3(aPos.x, 0.0, aPos.y);\n    vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "ground_game.frag": "uniform float uCamX;\nuniform float uCamZ;\nuniform float uPitch;   // block pitch (road every uPitch metres)\nuniform float uRoad;    // road width\nvarying vec3 vWP;\n\n/* Game ground: a grid of wet neon streets with lanes, crossings and sidewalks. */\nvoid main(){\n    float vDist = length(vWP - uEye);\n    vec2 w = vWP.xz + vec2(uCamX, uCamZ);                 // world position on the torus\n    vec2 q = mod(w + uPitch * 0.5, uPitch) - uPitch * 0.5; // distance to the nearest road axis (signed)\n    vec2 a = abs(q);\n    float hr = uRoad * 0.5;\n    float onX = step(a.x, hr), onZ = step(a.y, hr);   // inside a road running along z / along x\n    float road = max(onX, onZ);\n    float inter = onX * onZ;\n    vec3 col = vec3(0.012, 0.014, 0.02);\n    // sidewalks and block floor\n    float walk = 1.0 - road;\n    vec2 tl = abs(fract(w * 0.5) - 0.5);\n    col += walk * (vec3(0.028, 0.03, 0.042) + 0.012 * step(0.47, max(tl.x, tl.y)));\n    // curb neon lines\n    float curb = max(onX * (1.0 - onZ) * exp(-abs(a.x - hr) * 4.0), onZ * (1.0 - onX) * exp(-abs(a.y - hr) * 4.0));\n    col += uNeonA * curb * 0.5;\n    // centre double line and dashed lanes (not inside crossings)\n    float alongZ = onX * (1.0 - onZ), alongX = onZ * (1.0 - onX);\n    float centre = alongZ * (1.0 - smoothstep(0.08, 0.16, abs(a.x - 0.25))) + alongX * (1.0 - smoothstep(0.08, 0.16, abs(a.y - 0.25)));\n    col += vec3(1.0, 0.75, 0.25) * centre * 0.35;\n    float lane = alongZ * (1.0 - smoothstep(0.06, 0.14, abs(a.x - 4.6))) * step(0.5, fract(w.y / 6.0))\n               + alongX * (1.0 - smoothstep(0.06, 0.14, abs(a.y - 4.6))) * step(0.5, fract(w.x / 6.0));\n    col += vec3(0.7, 0.75, 0.85) * lane * 0.22;\n    // zebra crossings at the edge of each intersection\n    float zx = onX * step(hr, a.y) * step(a.y, hr + 3.0) * step(0.5, fract(w.x * 0.8));\n    float zz = onZ * step(hr, a.x) * step(a.x, hr + 3.0) * step(0.5, fract(w.y * 0.8));\n    col += vec3(0.6, 0.62, 0.7) * max(zx, zz) * 0.18;\n    // wet asphalt: neon streak reflections\n    // streaks run along the road: thin across, long and slowly varying along\n    float nz = h21(vec2(floor(w.x * 0.8), floor(w.y / 26.0)));\n    float nx = h21(vec2(floor(w.y * 0.8) + 91.0, floor(w.x / 26.0)));\n    float n = alongZ > 0.5 ? nz : nx;\n    float along = alongZ > 0.5 ? w.y : w.x;\n    float streak = pow(n, 6.0) * road * (0.55 + 0.45 * sin(along * 0.07 + n * 40.0));\n    col += mix(uNeonA, uNeonB, fract(n * 7.0)) * streak * 0.5;\n    col += uFog * 0.10 * smoothstep(15.0, 300.0, vDist);\n    col += vec3(0.5, 0.55, 0.7) * uFlash * 0.15;\n    col += headLight(vWP) * (0.35 + 0.65 * road) * 0.9;\n    col = applyFog(col, vDist * 0.8, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "ground_meadow.frag": "uniform float uCamX;\nuniform float uCamZ;\nuniform vec3 uSunDir;\nuniform vec3 uSunCol;\nvarying vec3 vWP;\n/* The past: an endless green meadow with dirt patches, clover, little flowers and wind waves in the grass. */\nvoid main(){\n    vec2 w = vWP.xz + vec2(uCamX, uCamZ);\n    float d = length(vWP - uEye);\n    float big = fbm(w * 0.012), mid = vnoise(w * 0.15), fine = vnoise(w * 2.3);\n    vec3 grass = mix(vec3(0.16, 0.34, 0.07), vec3(0.32, 0.50, 0.12), big);\n    grass = mix(grass, vec3(0.42, 0.52, 0.16), smoothstep(0.55, 0.8, mid) * 0.5);\n    grass *= 0.85 + 0.3 * fine * (1.0 - smoothstep(20.0, 120.0, d));\n    // wind waves rolling over the grass\n    grass *= 0.92 + 0.1 * sin(w.x * 0.08 + w.y * 0.05 - uTime * 1.6) * smoothstep(0.3, 0.7, big);\n    // dirt patches and a worn trail\n    float dirt = smoothstep(0.62, 0.72, fbm(w * 0.03 + 7.0));\n    vec3 col = mix(grass, vec3(0.36, 0.28, 0.17) * (0.8 + 0.4 * fine), dirt * 0.8);\n    // flowers (only near the camera)\n    vec2 fc = floor(w * 1.7);\n    float fl = step(0.985, h21(fc)) * (1.0 - smoothstep(0.08, 0.2, length(fract(w * 1.7) - 0.5))) * (1.0 - smoothstep(15.0, 45.0, d));\n    vec3 fcol = mix(vec3(1.0, 0.95, 0.3), vec3(0.95, 0.5, 0.85), step(0.5, h21(fc + 3.1)));\n    col = mix(col, fcol, fl * (1.0 - dirt));\n    col *= 0.55 + 0.6 * max(normalize(uSunDir).y, 0.0) * uSunCol;\n    col += headLight(vWP) * col * 2.2;\n    col = applyFog(col, d, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "mist.frag": "uniform float uMist;\nuniform vec2 uRes;\nvarying vec2 vUV;\n/* Drifting ground mist / fog banks over the whole frame (alpha-blended). */\nvoid main(){\n    vec2 p = vUV * vec2(uRes.x / uRes.y, 1.0);\n    float n1 = fbm(p * 2.2 + vec2(uTime * 0.035, uTime * 0.008));\n    float n2 = fbm(p * 4.5 - vec2(uTime * 0.06, -uTime * 0.01) + n1);\n    float band = smoothstep(0.85, 0.15, vUV.y);           // denser low, near the street\n    float m = (n1 * 0.65 + n2 * 0.45) * (0.45 + 0.75 * band);\n    m = smoothstep(0.18, 0.8, m) * uMist;\n    vec3 col = uFog * 1.7 + vec3(0.05) + uNeonA * 0.03 + vec3(0.6, 0.65, 0.8) * uFlash;\n    gl_FragColor = vec4(col, m * 0.92);\n}\n", "nature.frag": "uniform vec3 uSunDir;\nuniform vec3 uSunCol;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec4 vCol;\n/* Sunlit low-poly nature: lambert sun, sky / ground bounce, soft noise so flat faces are not flat colour. */\nvoid main(){\n    vec3 n = normalize(vN);\n    vec3 v = normalize(uEye - vWP);\n    if (dot(n, v) < 0.0) n = -n;\n    vec3 L = normalize(uSunDir);\n    float d = max(dot(n, L), 0.0);\n    vec3 base = vCol.rgb * (0.88 + 0.24 * vnoise(vWP.xz * 3.0 + vWP.y * 2.0));\n    vec3 amb = mix(vec3(0.16, 0.20, 0.12), uSkyTop * 0.9 + 0.08, n.y * 0.5 + 0.5);\n    vec3 col = base * (amb + uSunCol * d * 0.95);\n    col += base * 0.25 * pow(1.0 - max(dot(n, v), 0.0), 3.0) * vCol.a;     // translucent leaf rim\n    col = applyFog(col, length(uEye - vWP), vWP.y);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "nature.vert": "attribute vec3 aPos;\nattribute vec2 aCenter;\nattribute vec3 aNorm;\nattribute vec4 aCol;          // rgb colour, a: 1 = foliage (sways in the wind)\nuniform mat4 uVP;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;\nuniform float uWrapX;\nuniform float uZOff;\nuniform float uTime;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec4 vCol;\n/* Meadow props (trees, rocks, bushes) on the torus world, wrapped around the camera like the buildings. */\nvoid main(){\n    float z = mod(aCenter.y - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    float x = mod(aCenter.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5;\n    vec3 p = aPos;\n    float sway = aCol.a * max(p.y - 1.0, 0.0) * 0.025;\n    p.x += sway * sin(uTime * 1.3 + aCenter.x * 0.07);\n    p.z += sway * cos(uTime * 1.1 + aCenter.y * 0.05);\n    vec3 wp = vec3(x, 0.0, z) + p;\n    vN = aNorm; vCol = aCol; vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "particle.frag": "varying vec4 vCol;\nvarying float vKind;\nvarying float vSeed;\n/* Exhaust particles drawn as point sprites: soft turbulent smoke puffs (alpha blended)\n   and backfire flames (additive: white-blue core, orange tongue). */\nvoid main(){\n    vec2 q = gl_PointCoord * 2.0 - 1.0;\n    float r = length(q);\n    if (r > 1.0) discard;\n    if (vKind < 0.5) {\n        float n = vnoise(q * 2.6 + vSeed * 31.0) * 0.6 + vnoise(q * 5.3 - vSeed * 17.0) * 0.4;\n        float a = (1.0 - smoothstep(0.25, 1.0, r)) * (0.45 + 0.75 * n) * vCol.a;\n        gl_FragColor = vec4(vCol.rgb * (0.8 + 0.4 * n), a);\n    } else {\n        float n = vnoise(q * 3.0 + vec2(vSeed * 40.0, uTime * 9.0));\n        float core = exp(-r * r * 9.0);\n        float tongue = (1.0 - smoothstep(0.2, 1.0, r + (n - 0.5) * 0.5));\n        vec3 c = vCol.rgb * tongue * 0.9 + vec3(0.6, 0.75, 1.0) * core * 0.7;\n        gl_FragColor = vec4(c * vCol.a, 1.0);\n    }\n}\n", "particle.vert": "attribute vec3 aPos;\nattribute vec4 aCol;\nattribute vec2 aInfo;        // x: size in metres, y: kind (0 smoke, 1 flame) + seed * 0.9\nuniform mat4 uVP;\nuniform float uScale;        // viewport height / (2 tan(fov / 2))\nvarying vec4 vCol;\nvarying float vKind;\nvarying float vSeed;\nvoid main(){\n    gl_Position = uVP * vec4(aPos, 1.0);\n    gl_PointSize = clamp(aInfo.x * uScale / max(gl_Position.w, 0.05), 1.0, 300.0);\n    vCol = aCol;\n    vKind = floor(aInfo.y);\n    vSeed = fract(aInfo.y) / 0.9;\n}\n", "post.frag": "uniform float uFade;\nuniform float uScan;\nuniform vec2 uRes;\nvarying vec2 vUV;\n/* Vignette, CRT scanlines and fade-to-black (alpha-blended over the frame). */\nvoid main(){\n    vec2 p = vUV - 0.5;\n    float vig = smoothstep(0.35, 0.85, length(p * vec2(1.0, 0.85)));\n    float scan = uScan * 0.18 * step(0.5, fract(vUV.y * uRes.y / 3.0));\n    float a = clamp(max(uFade, vig * 0.75 + scan), 0.0, 1.0);\n    gl_FragColor = vec4(0.0, 0.0, 0.0, a);\n}\n", "post.vert": "attribute vec2 aPos;\nvarying vec2 vUV;\nvoid main(){\n    vUV = aPos * 0.5 + 0.5;\n    gl_Position = vec4(aPos, 0.0, 1.0);\n}\n", "rain.frag": "uniform float uRain;\nuniform float uSnow;\nvarying vec2 vC;\nvarying float vDist;\nvoid main(){\n    float a = (1.0 - abs(vC.y)) * smoothstep(0.0, 0.4, vC.x) * uRain;\n    a *= smoothstep(1.0, 5.0, vDist) * (1.0 - smoothstep(30.0, 70.0, vDist));\n    vec3 col = mix(vec3(0.6, 0.7, 0.85), uFog * 2.2 + uNeonA * 0.2, 0.4);\n    if (uSnow > 0.5) {\n        a = (1.0 - abs(vC.y)) * (1.0 - abs(vC.x * 2.0 - 1.0)) * uRain;\n        a *= smoothstep(0.5, 3.0, vDist) * (1.0 - smoothstep(25.0, 60.0, vDist));\n        col = vec3(0.9, 0.93, 1.0) + uNeonA * 0.08;\n        gl_FragColor = vec4(col * a * 0.9, 1.0);\n        return;\n    }\n    col += vec3(0.6) * uFlash;\n    gl_FragColor = vec4(col * a * 0.35, 1.0);\n}\n", "rain.vert": "attribute vec3 aSeed;\nattribute vec2 aCorner;\nuniform mat4 uV;\nuniform mat4 uP;\nuniform vec3 uEye;\nuniform float uTime;\nuniform float uCamZ;\nuniform float uRainSpeed;\nuniform float uSnow;\nuniform float uWind;\nuniform float uRainCenter;   // 1: rain all around the eye (free cameras), 0: ahead (city)\nvarying vec2 vC;\nvarying float vDist;\nvoid main(){\n    vec3 pos;\n    pos.x = uEye.x + (aSeed.x - 0.5) * 70.0;\n    float fall = uRainSpeed * (0.8 + aSeed.z * 0.4) * mix(1.0, 0.07, uSnow);\n    pos.y = uEye.y - 25.0 + mod(aSeed.y * 60.0 - uTime * fall, 60.0);\n    pos.z = mod(aSeed.z * 84.0 - uCamZ, 84.0) - 4.0 - uRainCenter * 38.0;\n    pos.x += uSnow * sin(uTime * (0.6 + aSeed.x) + aSeed.y * 30.0) * 1.2 + uWind * 0.02 * mod(uTime * 7.0 + aSeed.z * 50.0, 60.0);\n    vec3 vel = mix(vec3(-0.08 - uWind * 0.02, -1.0, 0.0), vec3(0.0, -0.06, 0.0), uSnow);\n    vec3 a = (uV * vec4(pos, 1.0)).xyz;\n    vec3 b = (uV * vec4(pos + vel * 0.9, 1.0)).xyz;\n    vec3 seg = b - a;\n    vec3 P = mix(a, b, aCorner.x);\n    vec3 perp = cross(seg, P);\n    float pl = length(perp);\n    perp = pl > 1e-4 ? perp / pl : vec3(1.0, 0.0, 0.0);\n    P += perp * aCorner.y * mix(0.018, 0.05, uSnow) + (uSnow > 0.5 ? normalize(seg + vec3(1e-4)) * (aCorner.x * 2.0 - 1.0) * 0.04 : vec3(0.0));\n    vC = aCorner;\n    vDist = length(P);\n    gl_Position = uP * vec4(P, 1.0);\n}\n", "sky.frag": "uniform vec3 uSunDir;\nuniform vec3 uSunCol;\nuniform float uSunStripes;\nuniform float uCloud;\nuniform float uDay;     // 1 = daytime sky (the meadow): no stars\nvarying vec3 vDir;\n\nvoid main(){\n    vec3 d = normalize(vDir);\n    float y = d.y;\n    vec3 col = mix(uFog * 1.15, uSkyTop, smoothstep(-0.05, 0.55, y));\n    // stars\n    vec2 sp = d.xz / (abs(y) + 0.25) * 260.0;\n    float st = step(0.9965, h21(floor(sp)));\n    col += (1.0 - uCloud) * (1.0 - uDay) * vec3(0.8, 0.85, 1.0) * st * smoothstep(0.12, 0.5, y) * (0.5 + 0.5 * sin(uTime * 3.0 + h21(floor(sp) + 3.0) * 40.0));\n    // moon / sun\n    float dd = distance(d, normalize(uSunDir));\n    float disk = smoothstep(0.075, 0.070, dd) * (1.0 - 0.75 * uCloud);\n    if (uSunStripes > 0.5) {\n        float sy = (d.y - uSunDir.y) / 0.075;\n        float stripe = step(0.0, sin(sy * 26.0 + uTime * 1.5)) + step(0.25, sy);\n        disk *= clamp(stripe, 0.0, 1.0);\n        col += mix(uSunCol, uNeonB, smoothstep(0.07, -0.07, d.y - uSunDir.y)) * disk * 1.4;\n    } else {\n        col += uSunCol * disk * 1.2;\n    }\n    col += uSunCol * 0.35 * exp(-dd * (7.0 + 6.0 * uCloud)) * (1.0 - 0.5 * uCloud);\n    // weather: moving cloud deck lit by the city glow (and by lightning)\n    if (uCloud > 0.01) {\n        vec2 cp = d.xz / (max(y, 0.0) + 0.18) * 1.6 + vec2(uTime * 0.03, uTime * 0.012);\n        float cl = smoothstep(0.35, 0.85, fbm(cp)) * smoothstep(-0.02, 0.18, y);\n        vec3 cc = uFog * 1.5 + uNeonB * 0.05 + vec3(0.7, 0.75, 0.95) * uFlash * 1.5;\n        float hide = uCloud * 0.85;\n        col = mix(col, uFog * 1.2 + vec3(0.5, 0.55, 0.7) * uFlash, hide * 0.55);\n        col = mix(col, cc, cl * uCloud);\n    }\n    // slow haze bands\n    float band = h21(vec2(floor(y * 40.0 + uTime * 0.02), 1.0));\n    col += uFog * 0.06 * band * smoothstep(0.35, 0.0, y);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "sky.vert": "attribute vec2 aPos;\nuniform vec3 uFwd;\nuniform vec3 uRight;\nuniform vec3 uUp;\nuniform vec2 uTan;\nvarying vec3 vDir;\nvoid main(){\n    vDir = uFwd + aPos.x * uTan.x * uRight + aPos.y * uTan.y * uUp;\n    gl_Position = vec4(aPos, 0.9999, 1.0);\n}\n", "solid.frag": "uniform float uGloss;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec4 vCol;\n/* Player car: dark metallic paint lit by the city: ambient fog, neon rim light, sliding light streaks. */\nvoid main(){\n    vec3 v = normalize(uEye - vWP);\n    vec3 n = normalize(vN);\n    if (dot(n, v) < 0.0) n = -n;            // two-sided: the loft faces are not all wound the same way\n    float d = length(uEye - vWP);\n    vec3 base = vCol.rgb;\n    vec3 amb = uFog * 0.9 + vec3(0.05, 0.05, 0.07);\n    float up = n.y * 0.5 + 0.5;\n    vec3 lit = base * (amb + up * 0.25 + vec3(0.6, 0.65, 0.8) * uFlash);\n    float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);\n    vec3 rim = mix(uNeonA, uNeonB, step(0.0, n.x)) * fres * 0.55;\n    // reflections of city lights sliding over the body\n    vec3 r = reflect(-v, n);\n    float band = smoothstep(0.92, 1.0, sin(r.y * 22.0 + r.x * 7.0 + uTime * 0.3) * 0.5 + 0.5);\n    vec3 refl = (mix(uFog * 1.4, uSkyTop, clamp(r.y, 0.0, 1.0)) + mix(uWinA, uNeonA, band) * band * 0.7) * uGloss;\n    vec3 col = lit + rim * uGloss + refl * (0.25 + 0.6 * fres);\n    col = mix(col, base * 2.4, vCol.a);\n    col = applyFog(col, d, vWP.y);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "solid.vert": "attribute vec3 aPos;\nattribute vec3 aNorm;\nattribute vec4 aCol;   // rgb, a = emissive amount\nuniform mat4 uVP;\nuniform mat4 uModel;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec4 vCol;\nvoid main(){\n    vec4 wp = uModel * vec4(aPos, 1.0);\n    vWP = wp.xyz;\n    vN = normalize((uModel * vec4(aNorm, 0.0)).xyz);\n    vCol = aCol;\n    gl_Position = uVP * wp;\n}\n", "studio_floor.frag": "uniform float uAlpha;\nvarying vec3 vWP;\n/* Showroom floor: glossy dark (the mirrored car shows through), neon turntable ring and a faint grid. */\nvoid main(){\n    vec2 p = vWP.xz + uEye.xz * 0.0;\n    float r = length(vWP.xz);\n    vec3 col = vec3(0.012, 0.013, 0.02) + uFog * 0.08;\n    float ring = exp(-abs(r - 3.6) * 18.0) + 0.5 * exp(-abs(r - 3.75) * 40.0);\n    col += uNeonA * ring * 0.9;\n    float sweep = smoothstep(0.96, 1.0, sin(atan(vWP.z, vWP.x) * 1.0 - uTime * 1.2) * 0.5 + 0.5) * step(r, 3.6);\n    col += uNeonA * sweep * 0.06;\n    vec2 g = abs(fract(vWP.xz * 0.5) - 0.5);\n    col += uNeonB * 0.05 * step(0.48, max(g.x, g.y)) * smoothstep(14.0, 4.0, r);\n    col *= smoothstep(26.0, 5.0, r) * 0.9 + 0.1;\n    vec3 hl = headLight(vWP) * 0.35;\n    col += hl;\n    float a = min(1.0, length(hl) * 0.8 + mix(uAlpha, 1.0, smoothstep(3.0, 9.0, r)));\n    gl_FragColor = vec4(col, a);\n}\n", "track.frag": "uniform vec3 uOrigin;\nuniform float uWet;          // 0 dry .. 1 flooded\nuniform float uHalfW;        // half width of the asphalt\nuniform float uLapLen;\nuniform vec3 uSunDir;\nuniform vec3 uSunCol;\nvarying vec3 vWP;\nvarying vec3 vTrk;\n/* Race track surface: asphalt with rubbered racing line, white edge lines, red/white kerbs, gravel / grass\n   run-off, start-finish checker, pit lane markings, wet sheen with sky reflections. */\nvoid main(){\n    float s = vTrk.x, lat = vTrk.y, kerb = vTrk.z, al = abs(lat);\n    vec2 w = vWP.xz + uOrigin.xz;\n    float d = length(vWP - uEye);\n    float fine = vnoise(w * 3.1), mid = vnoise(w * 0.35);\n    vec3 asph = vec3(0.13, 0.135, 0.145) * (0.8 + 0.35 * fine) * (0.9 + 0.2 * mid);\n    asph *= 1.0 - 0.25 * smoothstep(3.5, 0.0, abs(lat - 0.0)) * (1.0 - smoothstep(0.0, 1.0, kerb * 0.0));   // rubbered line\n    vec3 col = asph;\n    // edge lines\n    col = mix(col, vec3(0.85), smoothstep(0.16, 0.10, abs(al - (uHalfW - 0.35))) * step(al, uHalfW));\n    // kerbs (red / white blocks) where the corner asks for them, otherwise painted run-off\n    float onKerb = step(uHalfW, al) * step(al, uHalfW + 1.6);\n    vec3 kc = mix(vec3(0.85, 0.08, 0.08), vec3(0.92), step(0.5, fract(s / 3.0)));\n    col = mix(col, mix(vec3(0.13, 0.36, 0.12) * (0.8 + 0.3 * fine), kc, kerb), onKerb);\n    // beyond: gravel trap (fast-corner outside) or grass\n    float out1 = step(uHalfW + 1.6, al);\n    vec3 grav = vec3(0.55, 0.50, 0.42) * (0.75 + 0.4 * fine);\n    vec3 grass = mix(vec3(0.15, 0.33, 0.08), vec3(0.28, 0.46, 0.12), vnoise(w * 0.05)) * (0.85 + 0.25 * fine);\n    col = mix(col, mix(grass, grav, kerb), out1);\n    // pit lane (lat > 14): asphalt with yellow lines and box markings\n    float pit = step(14.0, lat) * step(lat, 31.0);\n    vec3 pitc = asph * 1.08;\n    pitc = mix(pitc, vec3(0.9, 0.75, 0.1), smoothstep(0.12, 0.06, abs(lat - 15.0)) + smoothstep(0.12, 0.06, abs(lat - 30.0)));\n    float box = step(abs(fract(s / 18.0) - 0.5), 0.36) * step(abs(lat - 25.5), 4.0) * (1.0 - step(abs(fract(s / 18.0) - 0.5), 0.33) * step(abs(lat - 25.5), 3.8));\n    col = mix(col, pitc, pit * (1.0 - onKerb));\n    // start / finish checker and grid slots\n    float sf = step(abs(mod(s + 1.0, uLapLen) - 1.0), 1.0) * step(al, uHalfW);\n    col = mix(col, vec3(0.9 * mod(floor(lat) + floor(s + 1.0), 2.0) + 0.03), sf);\n    float gs = mod(uLapLen - s, uLapLen);\n    float slot = step(gs, 64.0) * step(0.5, gs) * smoothstep(0.12, 0.05, abs(fract(gs / 8.0) - 0.06) * 8.0) * step(abs(abs(lat) - 3.2), 1.6);\n    col = mix(col, vec3(0.85), slot * 0.8);\n    // lighting\n    vec3 L = normalize(uSunDir);\n    col *= 0.55 + 0.6 * max(L.y, 0.0) * uSunCol;\n    // wet: darker, glossy, reflecting the sky\n    float wet = uWet * (1.0 - out1 * 0.6);\n    vec3 v = normalize(uEye - vWP);\n    float fres = pow(1.0 - max(v.y, 0.0), 4.0);\n    col *= 1.0 - 0.35 * wet;\n    col += (uSkyTop * 1.2 + uFog * 0.6) * fres * wet * 0.9;\n    col += uSunCol * pow(max(dot(reflect(-v, vec3(0, 1, 0)), L), 0.0), 60.0) * wet * 0.6;\n    col += headLight(vWP) * col * 3.0;\n    col = applyFog(col, d, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "track.vert": "attribute vec3 aPos;\nattribute vec3 aTrk;          // x: distance along the lap (m), y: lateral offset (m), z: kerb strength\nuniform mat4 uVP;\nuniform vec3 uOrigin;         // camera position in track coordinates (keeps float precision)\nvarying vec3 vWP;\nvarying vec3 vTrk;\nvoid main(){\n    vec3 wp = aPos - uOrigin;\n    vWP = wp; vTrk = aTrk;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "track_ground.frag": "uniform vec3 uOrigin;\nuniform vec3 uSunDir;\nuniform vec3 uSunCol;\nuniform float uWet;\nvarying vec3 vWP;\n/* Endless grass around the circuit (mowed stripes near the track, wild grass farther). */\nvoid main(){\n    vec2 w = vWP.xz + uOrigin.xz;\n    float d = length(vWP - uEye);\n    float big = fbm(w * 0.006), fine = vnoise(w * 1.7);\n    vec3 col = mix(vec3(0.14, 0.31, 0.07), vec3(0.30, 0.47, 0.12), big);\n    col *= 0.88 + 0.25 * fine * (1.0 - smoothstep(20.0, 120.0, d));\n    col *= 0.94 + 0.06 * step(0.5, fract(w.x / 12.0));\n    col *= 0.55 + 0.6 * max(normalize(uSunDir).y, 0.0) * uSunCol;\n    col *= 1.0 - 0.2 * uWet;\n    col += headLight(vWP) * col * 2.0;\n    col = applyFog(col, d, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "warp.frag": "uniform float uWarp;     // 0..1 charge of the chrono jump\nuniform float uWhite;    // white-out flash\nuniform float uRing;     // arrival ring 0..1 (expanding)\nuniform vec2 uRes;\nvarying vec2 vUV;\n/* Chrono jump overlay (additive): radial light streaks converging on the vanishing point, a pulsing\n   rim, an expanding arrival ring and the white-out. */\nvoid main(){\n    vec2 p = (vUV - vec2(0.5, 0.52)) * vec2(uRes.x / uRes.y, 1.0);\n    float r = length(p), a = atan(p.y, p.x);\n    float streak = pow(h21(vec2(floor(a * 90.0), floor(uTime * 24.0))), 6.0);\n    float speed = fract(r * 2.0 - uTime * (2.0 + uWarp * 6.0) + h21(vec2(floor(a * 90.0), 3.0)));\n    float lines = streak * smoothstep(0.08, 0.5, r) * smoothstep(0.0, 0.2, speed) * (1.0 - speed);\n    vec3 c = mix(uNeonA, vec3(0.85, 0.95, 1.0), 0.4) * lines * uWarp * 1.6;\n    c += uNeonA * smoothstep(0.55, 0.95, r) * uWarp * (0.35 + 0.25 * sin(uTime * 30.0));\n    float ring = smoothstep(0.05, 0.0, abs(r - uRing * 1.3)) * (1.0 - uRing);\n    c += mix(uNeonA, uNeonB, 0.3) * ring * 1.5;\n    c += vec3(1.0) * uWhite;\n    gl_FragColor = vec4(c, 1.0);\n}\n", "world.vert": "attribute vec3 aPos;\nattribute vec3 aNorm;\nattribute vec4 aCol;          // rgb, a: 1 = foliage sway\nuniform mat4 uVP;\nuniform vec3 uOrigin;\nuniform float uTime;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec4 vCol;\n/* Static scenery in absolute track coordinates (walls, stands, garages, trees), drawn relative to the camera. */\nvoid main(){\n    vec3 p = aPos;\n    float sway = aCol.a * 0.02 * max(p.y - 1.0, 0.0) * 0.1;\n    p.x += sway * sin(uTime * 1.3 + aPos.x * 0.07);\n    vec3 wp = p - uOrigin;\n    vN = aNorm; vCol = aCol; vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n"};</script>

const MODE_NAMES = { avenue: 'VOLO SUL VIALE', glide: 'PLANATA', drone: 'DRONE A BASSA QUOTA', skyline: 'SOPRA I TETTI' };

/* deterministic PRNG identical to the Java one (mulberry32) */
function rng(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;

    $('cRimC').textContent='COLORE CERCHI: '+C.rimcol.toUpperCase(); $('cLiv').textContent='LIVREA: '+['NESSUNA','DOPPIA STRISCIA','LATERALE'][C.livery];
    $('cStr').textContent='COLORE LIVREA: '+C.stripe.toUpperCase(); $('cTxt').textContent='SCRITTA: '+(C.text==='none'?'NESSUNA':C.text==='C'?C.customText:presets[+C.text]);
    $('cBrk').textContent='FRENI: '+KAGE_BRAKES[C.brakes].name; kageSave(C); };
  $('bCustom').onclick=()=>{ $('cust').classList.toggle('open'); tog('bCustom',$('cust').classList.contains('open')); };
  $('cKit').onclick=()=>{ C.kit=(C.kit+1)%3; lbl(); }; $('cRim').onclick=()=>{ C.rim={A:'B',B:'C',C:'A'}[C.rim]; lbl(); };
  $('cRimC').onclick=()=>{ C.rimcol=colK[(colK.indexOf(C.rimcol)+1)%colK.length]; lbl(); }; $('cLiv').onclick=()=>{ C.livery=(C.livery+1)%3; lbl(); };
  $('cStr').onclick=()=>{ C.stripe=colK[(colK.indexOf(C.stripe)+1)%colK.length]; lbl(); };
  $('cTxt').onclick=()=>{ const seq=['none','0','1','2','3']; C.text=seq[(seq.indexOf(String(C.text))+1)%seq.length]; lbl(); };
  $('cTxtOk').onclick=()=>{ const t=($('cTxtIn').value||'').toUpperCase().replace(/[^A-Z0-9 .\-]/g,'').slice(0,12); if(!t) return; C.customText=t; C.text='C'; sr.car.replaceParts(CarHD.buildText(t)); lbl(); };
  $('cBrk').onclick=()=>{ C.brakes=(C.brakes+1)%KAGE_BRAKES.length; lbl(); };
  if(C.text==='C') sr.car.replaceParts(CarHD.buildText(C.customText)); lbl();
  // engine sound starts with the first touch (browser rule), SU DI GIRI: hold to rev, release for the crackle
  const snd=()=>sr.audio.start(); addEventListener('pointerdown',snd); addEventListener('keydown',snd);
  $('bMotor').onclick=()=>{ sr.tg.engine=!sr.tg.engine; tog('bMotor',sr.tg.engine); $('bMotor').textContent=sr.tg.engine?'MOTORE ON':'MOTORE OFF';
    if(sr.tg.engine){ sr.eng.rpm=300; sr.tg.rev=0.45; setTimeout(()=>{ if(!revHeld) sr.tg.rev=0; },260); } };
  let revHeld=false;
  const rev=on=>{ revHeld=on; if(on&&!sr.tg.engine) $('bMotor').onclick(); sr.tg.rev=on?1:0; tog('bRev',on); };
  $('bRev').addEventListener('pointerdown',e=>{ e.stopPropagation(); snd(); rev(true); });
  for(const ev of ['pointerup','pointerleave','pointercancel']) $('bRev').addEventListener(ev,()=>rev(false));
  addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat) rev(true); });
  addEventListener('keyup',e=>{ if(e.code==='Space') rev(false); });
  setInterval(()=>{ $('rpm').textContent=sr.tg.engine?(Math.round(sr.eng.rpm/50)*50)+' RPM':''; },80);
  // orbit / look around with drag, zoom with wheel / pinch
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ drag=[e.clientX,e.clientY]; });
  addEventListener('pointerup',()=>drag=null);
  addEventListener('pointermove',e=>{ if(!drag) return; const dx=(e.clientX-drag[0])/innerWidth, dy=(e.clientY-drag[1])/innerHeight; drag=[e.clientX,e.clientY];
    if(sr.cam.mode==='cockpit'){ sr.cam.look-=dx*3; sr.cam.lookP=Math.max(-0.8,Math.min(0.8,sr.cam.lookP-dy*2)); }
    else { sr.turn+=dx*4; sr.cam.pitch=Math.max(0.02,Math.min(1.2,sr.cam.pitch+dy*2)); } });
  cv.addEventListener('wheel',e=>{ sr.cam.dist=Math.max(4,Math.min(14,sr.cam.dist*(1+e.deltaY*0.001))); });
  if(q.has('shot')){
    for(const k of ['hood','doors']) if(q.has(k)) { sr.tg[k]=1; sr.st[k==='doors'?'doorL':'hood']=1; if(k==='doors') sr.st.doorR=1; }
    if(q.has('mode')) sr.cam.mode=q.get('mode');
    if(q.has('steer')){ sr.st.wheelSteer=0.5; sr.st.steerWheel=2.4; }
    if(q.has('yaw')) sr.cam.yaw=parseFloat(q.get('yaw')); if(q.has('pitch')) sr.cam.pitch=parseFloat(q.get('pitch')); if(q.has('dist')) sr.cam.dist=parseFloat(q.get('dist'));
    for(const k of ['kit','livery','brakes']) if(q.has(k)){ C[k]=+q.get(k); } for(const k of ['rim','rimcol','stripe']) if(q.has(k)) C[k]=q.get(k); if(q.has('text')) C.text=q.get('text'); if(q.has('hand')) sr.tg.hand=1;
    if(q.has('fly')){ sr.tg.fly=1; sr.flyK=1; }
    if(q.has('roof')){ sr.tg.roof=sr.st.roof=parseFloat(q.get('roof')); }
    if(q.has('tgt')) sr.cam.tgt=q.get('tgt').split(',').map(parseFloat);
    if(q.has('specs')) $('specs').classList.add('open');
    sr.cam.auto=false;
    if(q.has('fx')){ const fx=q.get('fx'), M=CarRenderUtil.RY(0), tp=EngineFX.tipsFrom(M); sr.eng.setType(o.power); const stp=th=>{ sr.eng.update(1/60,{free:true,throttle:th}); sr.fx.update(1/60,tp.tips,tp.dir,[0,0,0],sr.eng,tp.hubs); };
      for(let i=0;i<70;i++) stp(1); for(let i=0;i<4;i++) stp(0); if(fx==='smoke') for(let i=0;i<60;i++) stp(0); else for(let i=0;i<60&&sr.fx.flameN<8;i++) stp(0); sr.turn=0; }
    sr.frame(0.001); window.__done=true; return;
  }
  let prev=performance.now();
  function loop(now){ const dt=Math.min(0.05,(now-prev)/1000); prev=now; sr.frame(dt); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
