<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cybercity 3D — salvaschermo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;color:#ecfcff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:4vmin;bottom:4vmin;pointer-events:none;text-shadow:0 0 12px var(--a)}
  #clock{font-size:11vmin;font-weight:700;letter-spacing:.06em;line-height:1;position:relative}
  #clock span{position:absolute;left:0;top:0;mix-blend-mode:screen}
  #date{font-size:2.4vmin;letter-spacing:.35em;opacity:.8;margin-top:1.2vmin}
  #tag{position:fixed;right:4vmin;top:4vmin;font-size:1.8vmin;letter-spacing:.3em;opacity:.65;text-align:right;pointer-events:none}
  #panel{position:fixed;right:3vmin;bottom:3vmin;background:rgba(7,11,19,.82);border:1px solid var(--a);box-shadow:0 0 24px rgba(0,255,226,.15);
    padding:14px 16px;font-size:13px;display:none;min-width:250px;backdrop-filter:blur(8px)}
  #panel.open{display:block}
  #panel h3{margin:0 0 10px;font-size:13px;letter-spacing:.3em;color:var(--a)}
  #panel label{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 0}
  #panel select,#panel input{background:#101d30;color:#ecfcff;border:1px solid #214557;font:inherit}
  #gear{position:fixed;right:3vmin;bottom:3vmin;width:42px;height:42px;border:1px solid var(--a);background:rgba(7,11,19,.6);color:var(--a);
    font-size:20px;cursor:pointer;opacity:0;transition:opacity .4s}
  body.active #gear{opacity:1}
  body.idle{cursor:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;color:#ff6177}
</style>
</head>
<body style="--a:#00ffe2">
<canvas id="c"></canvas>
<div id="hud"><div id="clock"></div><div id="date"></div></div>
<div id="tag">CYBERCITY 3D<br><span id="modeName"></span></div>
<button id="gear" title="Impostazioni">⚙</button>
<div id="panel">
  <h3>// CYBERCITY 3D</h3>
  <label>Atmosfera <select id="palette"></select></label>
  <label>Telecamera <select id="mode"></select></label>
  <label>Velocità <input id="speed" type="range" min="0.3" max="2.5" step="0.1"></label>
  <label>Meteo <select id="weather"></select></label>
  <label>Pioggia (senza meteo) <input id="rain" type="range" min="0" max="1" step="0.05"></label>
  <label>Traffico volante <input id="traffic" type="checkbox"></label>
  <label>Scanlines CRT <input id="scanlines" type="checkbox"></label>
  <label>Orologio glitch <input id="clockOn" type="checkbox"></label>
  <label>Qualità <select id="quality"><option value="0.6">Batteria</option><option value="0.85">Bilanciata</option><option value="1">Massima</option></select></label>
  <div style="opacity:.6;margin-top:8px">F = schermo intero · Spazio = cambia telecamera · P = atmosfera</div>
</div>
<div id="err"></div>
<script>const SHADERS={"billboard.frag": "varying vec2 vUV;\nvarying vec4 vMisc;\nvarying float vDist;\nvarying float vY;\n\n/* 5x5 symmetric pseudo glyph (kanji / katakana feel) */\nfloat glyph(vec2 cell, vec2 f){\n    vec2 g = floor(f * 5.0);\n    g.x = min(g.x, 4.0 - g.x);\n    float on = step(0.52, h21(cell * 1.37 + g * 0.71));\n    vec2 inner = fract(f * 5.0);\n    return on * step(0.12, inner.x) * step(0.12, inner.y);\n}\n\nvoid main(){\n    float seed = vMisc.x, id = sid(vMisc.x), kind = vMisc.y, ratio = vMisc.z;\n    vec2 uv = vUV;\n    float gt = floor(uTime * 9.0);\n    float glitch = step(0.94, h21(vec2(gt, id)));\n    uv.x += glitch * (h21(vec2(floor(uv.y * 14.0), gt)) - 0.5) * 0.25;\n    vec3 cA = mix(uNeonA, uNeonB, fract(seed * 3.3));\n    vec3 cB = mix(uNeonB, uWinA, fract(seed * 5.7));\n    vec3 col;\n    if (kind < 0.5) {\n        // vertical scrolling glyph column\n        vec2 grid = vec2(2.0, 2.0 * ratio);\n        vec2 q = uv * grid + vec2(0.0, uTime * 0.8 + seed * 10.0);\n        vec2 cell = floor(q);\n        col = mix(cA, cB, uv.y) * glyph(cell + id, fract(q)) * 1.6;\n    } else if (kind < 1.5) {\n        // equalizer bars / ad pulses\n        float bx = floor(uv.x * 12.0);\n        float hgt = 0.25 + 0.7 * abs(sin(uTime * (1.5 + h21(vec2(bx, id)) * 3.0) + bx));\n        float bar = step(uv.y, hgt) * step(0.15, fract(uv.x * 12.0));\n        col = mix(cB, cA, uv.y / max(hgt, 0.01)) * bar * 1.3;\n        col += cA * 0.15;\n    } else {\n        // pulsing ring logo with glyph caption\n        vec2 p = (uv - vec2(0.5, 0.62)) * vec2(1.0, ratio);\n        float r = length(p);\n        float ring = smoothstep(0.03, 0.0, abs(r - 0.28 - 0.03 * sin(uTime * 3.0)));\n        float core = smoothstep(0.13, 0.1, r) * (0.6 + 0.4 * sin(uTime * 5.0 + seed));\n        vec2 q = vec2(uv.x * 6.0, uv.y * 6.0 * ratio);\n        float cap = step(uv.y, 0.25) * glyph(floor(q) + id + floor(uTime * 0.5), fract(q));\n        col = cA * (ring + core) * 1.5 + cB * cap * 1.4;\n    }\n    // frame + scanlines + panel background\n    float fr = 1.0 - step(0.035, uv.x) * step(uv.x, 0.965) * step(0.02, uv.y) * step(uv.y, 0.98);\n    col += cA * fr * 1.2;\n    col += cA * 0.04;\n    col *= 0.82 + 0.18 * sin(vUV.y * 300.0);\n    col *= 1.0 - glitch * 0.5 * step(0.5, h21(vec2(gt, 7.0)));\n    col = applyFog(col, vDist, vY);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "billboard.vert": "attribute vec3 aPos;\nattribute vec2 aCenter;\nattribute vec2 aUV;\nattribute vec4 aMisc;\nuniform mat4 uVP;\nuniform vec3 uEye;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;   // game: camera position on the torus world\nuniform float uWrapX;  // > 0: wrap x too (game world), 0: no x wrap (screensaver)\nuniform float uZOff;   // where the z wrap seam sits (0.08 screensaver, 0.5 game)\nvarying vec2 vUV;\nvarying vec4 vMisc;\nvarying float vDist;\nvarying float vY;\nvoid main(){\n    float z = mod(aCenter.y - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    float x = uWrapX > 0.0 ? mod(aCenter.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5 : aCenter.x;\n    vec3 wp = vec3(x, 0.0, z) + aPos;\n    vUV = aUV; vMisc = aMisc; vY = wp.y;\n    vDist = length(wp - uEye);\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "building.frag": "varying vec3 vN;\nvarying vec2 vUV;\nvarying vec4 vMisc;\nvarying vec3 vWP;\n\nvoid main(){\n    float vDist = length(vWP - uEye); // per-pixel: interpolating it across big quads is wrong\n    float seed = vMisc.x, id = sid(vMisc.x), kind = vMisc.y, fw = vMisc.z, top = vMisc.w;\n    vec3 base = vec3(0.016, 0.018, 0.028) + uFog * 0.06;\n    vec3 nA = mix(uNeonA, uNeonB, step(0.5, fract(seed * 7.31)));\n    vec3 col;\n    if (vN.y > 0.5) {\n        vec2 g = abs(fract(vUV * 0.2) - 0.5);\n        col = base * 0.7 + nA * 0.06 * step(0.46, max(g.x, g.y));\n        float blink = step(0.82, fract(uTime * 0.6 + seed * 3.1));\n        col += vec3(1.0, 0.12, 0.1) * blink * smoothstep(1.4, 0.0, length(vUV)) * 3.0;\n        if (kind > 0.5) col += nA * 0.22;\n    } else {\n        float density = 0.22 + 0.5 * fract(seed * 3.71);\n        vec2 cs = kind > 1.5 ? vec2(1.25, 1.5) : vec2(1.9, 2.7);\n        vec2 q = vUV / cs;\n        vec2 c = floor(q);\n        vec2 f = fract(q);\n        float m = step(0.16, f.x) * step(f.x, 0.84) * step(0.24, f.y) * step(f.y, 0.80);\n        float r = h21(c * 0.731 + vec2(id * 1.37, floor(dot(vN, vec3(3.0, 0.0, 7.0)) + 0.5) * 11.0));\n        float lit = step(1.0 - density, r);\n        float flick = h21(c + vec2(floor(uTime * 0.08 + r * 20.0), id));\n        lit *= step(0.035, flick);\n        float pal = fract(r * 13.7 + seed);\n        vec3 wc = pal < 0.62 ? uWinA : (pal < 0.86 ? uWinB : uWinC);\n        wc *= 0.5 + 0.9 * fract(r * 91.1);\n        // whole lit floors (offices)\n        float floorLit = step(0.93, h21(vec2(c.y * 1.3, id)));\n        vec3 detail = base + m * max(lit, floorLit) * wc;\n        float lod = smoothstep(55.0, 210.0, vDist);\n        vec3 far = base + wc * density * 0.30;\n        col = mix(detail, far, lod);\n        col *= 0.7 + 0.3 * smoothstep(0.0, top, vWP.y);\n        if (kind > 0.5) {\n            float e = min(vUV.x, fw - vUV.x);\n            float pulse = 0.78 + 0.22 * sin(uTime * 2.0 + seed * 10.0);\n            col += nA * (exp(-e * 2.2) * 0.9 + exp(-max(0.0, top - vWP.y) * 1.1) * 1.5) * pulse;\n            float band = exp(-abs(fract(vWP.y / 23.0 + seed) - 0.5) * 70.0);\n            col += nA * band * 0.7 * step(0.45, fract(seed * 5.1));\n        }\n        // street-level shop glow\n        col += mix(uNeonA, uWinA, fract(seed * 9.0)) * exp(-vWP.y * 0.22) * 0.55;\n    }\n    col = applyFog(col, vDist, vWP.y);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "building.vert": "attribute vec3 aPos;\nattribute vec2 aCenter;\nattribute vec3 aNorm;\nattribute vec2 aUV;\nattribute vec4 aMisc;\nuniform mat4 uVP;\nuniform vec3 uEye;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;   // game: camera position on the torus world\nuniform float uWrapX;  // > 0: wrap x too (game world), 0: no x wrap (screensaver)\nuniform float uZOff;   // where the z wrap seam sits (0.08 screensaver, 0.5 game)\nvarying vec3 vN;\nvarying vec2 vUV;\nvarying vec4 vMisc;\nvarying vec3 vWP;\nvoid main(){\n    float z = mod(aCenter.y - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    float x = uWrapX > 0.0 ? mod(aCenter.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5 : aCenter.x;\n    vec3 wp = vec3(x, 0.0, z) + aPos;\n    vN = aNorm; vUV = aUV; vMisc = aMisc; vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "car.frag": "varying vec2 vC;\nvarying float vAway;\nvarying float vDist;\nvarying float vSeed;\nvoid main(){\n    float side = exp(-vC.y * vC.y * 3.5);\n    float along = mix(0.25, 1.0, vC.x);\n    vec3 tailCol = vec3(1.0, 0.12, 0.18);\n    vec3 headCol = mix(vec3(0.85, 0.95, 1.0), uNeonA, step(0.8, fract(vSeed * 13.0)));\n    vec3 col = mix(headCol, tailCol, vAway);\n    col += vec3(1.0) * pow(vC.x, 8.0) * 0.6;\n    float fade = 1.0 - fogAmount(vDist) * 0.85;\n    gl_FragColor = vec4(col * side * along * fade * 1.3, 1.0);\n}\n", "car.vert": "attribute vec4 aLane;   // origin x, y, z, speed (m/s)\nattribute vec4 aDir;    // dir x, dir z, trail length, seed\nattribute vec2 aCorner; // x: 0 = tail, 1 = head ; y: side -1..1\nuniform mat4 uV;\nuniform mat4 uP;\nuniform vec3 uEye;\nuniform float uTime;\nuniform float uCamZ;\nuniform float uL;\nuniform float uCamX;   // game: camera position on the torus world\nuniform float uWrapX;  // > 0: wrap x too (game world), 0: no x wrap (screensaver)\nuniform float uZOff;   // where the z wrap seam sits (0.08 screensaver, 0.5 game)\nuniform float uWidth;\nvarying vec2 vC;\nvarying float vAway;\nvarying float vDist;\nvarying float vSeed;\nvoid main(){\n    vec3 d = vec3(aDir.x, 0.0, aDir.y);\n    float p = mod(aDir.w * 977.0 + aLane.w * uTime, 2.0 * uL);\n    vec3 head = aLane.xyz + d * p;\n    head.x = mod(head.x - uCamX + uWrapX * 0.5, uWrapX) - uWrapX * 0.5;\n    head.z = mod(head.z - uCamZ + uL * uZOff, uL) - uL * uZOff;\n    head.y += sin(uTime * 0.7 + aDir.w * 50.0) * 0.4;\n    vec3 tail = head - d * aDir.z;\n    vec3 h = (uV * vec4(head, 1.0)).xyz;\n    vec3 t = (uV * vec4(tail, 1.0)).xyz;\n    vec3 seg = h - t;\n    vec3 P = mix(t, h, aCorner.x);\n    vec3 perp = cross(seg, P);\n    float pl = length(perp);\n    perp = pl > 1e-4 ? perp / pl : vec3(1.0, 0.0, 0.0);\n    float sl = length(seg);\n    vec3 sdir = sl > 1e-4 ? seg / sl : vec3(0.0, 1.0, 0.0);\n    float w = uWidth * (1.0 + 0.004 * length(P));\n    P += perp * aCorner.y * w + sdir * (aCorner.x * 2.0 - 1.0) * w;\n    vC = aCorner;\n    vAway = step(0.0, dot(d, head - uEye));\n    vDist = length(head - uEye);\n    vSeed = aDir.w;\n    gl_Position = uP * vec4(P, 1.0);\n}\n", "car_hd.frag": "uniform float uKey;        // key light strength (studio > street)\nuniform float uGlassPass;  // 1 while drawing the transparent glass\nuniform float uLights;     // headlights / tail lights on\nuniform float uBrake;\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec2 vUV;\nvarying vec3 vCol;\nvarying vec4 vPar;\n\n/* Procedural PBR-ish car materials: carbon twill, stitched leather, tyre tread, drilled discs, HUD screens, LED lights, grille. */\nvoid main(){\n    vec3 v = normalize(uEye - vWP);\n    vec3 n = normalize(vN);\n    if (dot(n, v) < 0.0) n = -n;\n    float rough = vPar.x, metal = vPar.y, em = vPar.z, pat = vPar.w;\n    vec3 base = vCol;\n    vec2 uv = vUV;\n    float emis = em;\n    if (pat > 0.5 && pat < 1.5) {            // carbon fibre twill\n        vec2 q = uv * 60.0;\n        float a = mod(floor(q.x) + floor(q.y), 2.0);\n        float w = abs(fract(a > 0.5 ? q.x : q.y) - 0.5);\n        base *= 0.55 + 0.9 * (0.4 + 0.6 * w) * (0.7 + 0.3 * a);\n        rough = mix(rough, 0.15, a * 0.5);\n    } else if (pat > 1.5 && pat < 2.5) {     // leather: grain + accent stitching\n        float g = h21(floor(uv * 260.0)) * 0.12;\n        base *= 0.9 + g;\n        float st = (1.0 - smoothstep(0.0, 0.04, abs(fract(uv.y * 6.0) - 0.5))) * step(0.5, fract(uv.x * 90.0));\n        base = mix(base, uNeonB * 0.9, st * 0.8);\n    } else if (pat > 2.5 && pat < 3.5) {     // tyre: tread blocks on the crown, lettering band on the sidewall\n        float crown = smoothstep(0.30, 0.38, uv.y) * (1.0 - smoothstep(0.62, 0.70, uv.y));\n        float groove = step(0.82, fract(uv.x + (uv.y - 0.5) * 3.0)) + step(0.92, fract(uv.y * 5.0));\n        base *= 1.0 - crown * clamp(groove, 0.0, 1.0) * 0.7;\n        float side = 1.0 - crown;\n        float letters = side * step(0.6, h21(vec2(floor(uv.x * 12.0), floor(uv.y * 9.0)))) * step(0.12, uv.y) * step(uv.y, 0.22);\n        base += vec3(0.08) * letters;\n        rough = 0.9;\n    } else if (pat > 3.5 && pat < 4.5) {     // HUD screen\n        vec2 q = uv;\n        float bars = step(0.5, fract(q.x * 18.0)) * step(q.y, 0.25 + 0.6 * h21(vec2(floor(q.x * 18.0), floor(uTime * 2.0))));\n        float ring = smoothstep(0.02, 0.0, abs(length((q - vec2(0.22, 0.5)) * vec2(3.0, 1.0)) - 0.32));\n        float scan = 0.85 + 0.15 * sin(q.y * 300.0);\n        base = (uNeonA * (0.25 + ring * 1.2) + uNeonB * bars * 0.6) * scan;\n        emis = 1.0;\n    } else if (pat > 4.5 && pat < 5.5) {     // drilled + slotted brake disc\n        vec2 q = vec2(uv.x * 48.0, uv.y * 3.0);\n        float hole = 1.0 - smoothstep(0.18, 0.24, length(fract(q) - 0.5));\n        base *= 1.0 - hole * 0.85;\n        base += vec3(0.04) * step(0.97, fract(uv.x * 12.0 + uv.y));\n    } else if (pat > 5.5 && pat < 6.5) {     // segmented tail light bar\n        float seg = step(0.18, fract(uv.x * 46.0));\n        emis = em * seg * (uLights * 0.8 + uBrake * 1.6 + 0.15);\n    } else if (pat > 6.5 && pat < 7.5) {     // LED headlight dots\n        vec2 q = fract(uv * vec2(90.0, 30.0)) - 0.5;\n        float led = 1.0 - smoothstep(0.2, 0.35, length(q));\n        base = mix(base * 0.35, base, led);\n        emis = em * (0.25 + 0.95 * uLights) * (0.4 + 0.6 * led);\n    } else if (pat > 7.5 && pat < 8.5) {     // hexagonal grille\n        vec2 q = uv * vec2(60.0, 34.0);\n        q.x += step(1.0, mod(floor(q.y), 2.0)) * 0.5;\n        float hex = smoothstep(0.32, 0.4, length(fract(q) - 0.5));\n        base *= 0.15 + 0.85 * hex;\n    } else if (pat > 8.5 && pat < 9.5) {     // neon: gentle pulse\n        emis = em * (0.85 + 0.15 * sin(uTime * 2.2 + vWP.x * 2.0));\n    } else if (pat > 9.5) {                  // carpet\n        base *= 0.8 + 0.3 * h21(floor(uv * 400.0));\n    }\n    vec3 L = normalize(vec3(0.35, 0.8, 0.45));\n    float diff = max(dot(n, L), 0.0);\n    vec3 amb = uFog * 0.7 + uSkyTop * 0.6 + vec3(0.035) + (n.y * 0.5 + 0.5) * vec3(0.05, 0.05, 0.07);\n    amb += uKey * 0.22 * (n.y * 0.5 + 0.5) + uKey * 0.08;            // soft studio / street fill\n    vec3 r = reflect(-v, n);\n    float band = smoothstep(0.75, 1.0, sin(r.x * 9.0 + r.z * 5.0 + r.y * 3.0) * 0.5 + 0.5);\n    vec3 env = mix(uFog * 1.2 + vec3(0.02), uSkyTop * 1.4 + vec3(0.05, 0.06, 0.09), smoothstep(-0.3, 0.6, r.y));\n    env += mix(uNeonA, uNeonB, step(0.0, r.x)) * band * 0.55 + vec3(0.9, 0.85, 0.8) * smoothstep(0.985, 1.0, dot(r, L)) * 2.0;\n    env += vec3(0.85, 0.9, 1.0) * uKey * 0.5 * smoothstep(0.75, 0.9, r.y) * (0.6 + 0.4 * step(0.5, fract(r.x * 2.5 + 0.25)));  // overhead softboxes\n    // crisp horizon line: dark floor below, bright rim just above \u2014 gives the body its \"liquid\" definition\n    env = mix(env * 0.35, env, smoothstep(-0.02, 0.02, r.y));\n    env += vec3(0.55, 0.6, 0.75) * (uKey * 0.6 + 0.25) * smoothstep(0.0, 0.03, r.y) * (1.0 - smoothstep(0.03, 0.12, r.y));\n    // long side softbox strip\n    env += vec3(1.0) * uKey * 0.45 * smoothstep(0.86, 0.9, abs(r.x)) * smoothstep(0.05, 0.15, r.y) * (1.0 - smoothstep(0.35, 0.45, r.y));\n    float ndv = max(dot(n, v), 0.0);\n    float fres = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);\n    vec3 F0 = mix(vec3(0.04), base, metal);\n    float shin = mix(220.0, 6.0, rough);\n    float spec = pow(max(dot(reflect(-L, n), v), 0.0), shin) * (1.0 - rough) * 1.6;\n    // cheap ambient occlusion: darker toward the ground, the sills and inside the wheel arches\n    float ao = 0.45 + 0.55 * smoothstep(0.12, 0.62, vWP.y);\n    vec3 col = base * (1.0 - metal) * (amb + diff * uKey * 0.9) * ao;\n    col += env * mix(vec3(fres), base, metal) * (1.0 - rough * 0.8);\n    col += spec * mix(vec3(1.0), base, metal) * uKey;\n    // clear coat on painted panels: a second, razor-sharp lobe on top of the base paint\n    if (pat < 0.5 && rough < 0.5 && uGlassPass < 0.5) {\n        float cc = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);\n        col += env * cc * 0.9 * ao;\n        col += vec3(1.0) * pow(max(dot(reflect(-L, n), v), 0.0), 900.0) * 3.0 * uKey;\n    }\n    col += base * emis * 2.4;\n    col += vec3(0.6, 0.65, 0.8) * uFlash * 0.25;\n    col = applyFog(col, length(uEye - vWP), vWP.y);\n    float alpha = 1.0;\n    if (uGlassPass > 0.5) {                  // tinted glass: you see the cabin, but it clearly is a closed coup\u00e9\n        col = col * 0.8 + env * (0.10 + fres * 0.9);\n        alpha = clamp(0.48 + 0.5 * fres + spec * 0.5, 0.0, 0.95);\n    }\n    gl_FragColor = vec4(col, alpha);\n}\n", "car_hd.vert": "attribute vec3 aPos;\nattribute vec3 aNorm;\nattribute vec2 aUV;\nattribute float aMat;\nuniform mat4 uVP;\nuniform mat4 uModel;\nuniform vec3 uMatCol[20];\nuniform vec4 uMatPar[20];   // roughness, metalness, emissive, pattern id\nvarying vec3 vN;\nvarying vec3 vWP;\nvarying vec2 vUV;\nvarying vec3 vCol;\nvarying vec4 vPar;\nvoid main(){\n    int m = int(aMat + 0.5);\n    vCol = uMatCol[m];\n    vPar = uMatPar[m];\n    vec4 wp = uModel * vec4(aPos, 1.0);\n    vWP = wp.xyz;\n    vN = (uModel * vec4(aNorm, 0.0)).xyz;\n    vUV = aUV;\n    gl_Position = uVP * wp;\n}\n", "common.glsl": "#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nuniform float uTime;\nuniform float uL;\nuniform float uFar;    // distance where everything has faded into the fog\nuniform float uFogDen;\nuniform vec3 uEye;\nuniform vec3 uFog;\nuniform vec3 uSkyTop;\nuniform vec3 uWinA;\nuniform vec3 uWinB;\nuniform vec3 uWinC;\nuniform vec3 uNeonA;\nuniform vec3 uNeonB;\nuniform float uFlash;   // lightning\n\nfloat h21(vec2 p){\n    p = fract(p * vec2(123.34, 456.21));\n    p += dot(p, p + 45.32);\n    return fract(p.x * p.y);\n}\n\nfloat vnoise(vec2 p){\n    vec2 i = floor(p), f = fract(p);\n    f = f * f * (3.0 - 2.0 * f);\n    float a = h21(i), b = h21(i + vec2(1.0, 0.0)), c = h21(i + vec2(0.0, 1.0)), d = h21(i + vec2(1.0, 1.0));\n    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);\n}\nfloat fbm(vec2 p){\n    float v = 0.0, a = 0.5;\n    for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }\n    return v;\n}\n\n/* Integer id from an interpolated per-vertex seed: varyings are not bit-exact,\n   so hashing the raw float produces per-pixel noise. */\nfloat sid(float s){ return floor(s * 251.0 + 0.5); }\n\n/* Exponential fog plus a hard fade near the end of the wrapped city chunk,\n   so buildings re-entering at the horizon never pop. */\nfloat fogAmount(float d){\n    float f = 1.0 - exp(-d * uFogDen);\n    return max(f, smoothstep(uFar * 0.60, uFar * 0.84, d));\n}\nvec3 applyFog(vec3 col, float d, float y){\n    float f = fogAmount(d);\n    vec3 fc = uFog * (1.0 + 0.35 * exp(-max(y, 0.0) * 0.02)) + vec3(0.55, 0.6, 0.8) * uFlash;\n    return mix(col, fc, f);\n}\n", "glow.frag": "uniform float uGlow;\nvarying vec2 vUV;\nvarying vec4 vCol;\nvarying vec3 vWP;\n/* Additive soft light: underglow, headlight pools, tail-light bloom. */\nvoid main(){\n    float f = exp(-dot(vUV, vUV) * 2.6) * (1.0 - smoothstep(0.85, 1.0, max(abs(vUV.x), abs(vUV.y))));\n    float d = length(uEye - vWP);\n    float fade = 1.0 - fogAmount(d) * 0.9;\n    gl_FragColor = vec4(vCol.rgb * f * vCol.a * uGlow * fade, 1.0);\n}\n", "glow.vert": "attribute vec3 aPos;\nattribute vec2 aUV;\nattribute vec4 aCol;\nuniform mat4 uVP;\nuniform mat4 uModel;\nvarying vec2 vUV;\nvarying vec4 vCol;\nvarying vec3 vWP;\nvoid main(){\n    vec4 wp = uModel * vec4(aPos, 1.0);\n    vWP = wp.xyz; vUV = aUV; vCol = aCol;\n    gl_Position = uVP * wp;\n}\n", "ground.frag": "uniform float uCamZ;\nvarying vec3 vWP;\n\nvoid main(){\n    float vDist = length(vWP - uEye); // per-pixel: interpolating it across big quads is wrong\n    float wz = vWP.z + uCamZ;\n    float ax = abs(vWP.x);\n    vec3 col = vec3(0.010, 0.012, 0.018);\n    // dashed lane lines on the avenue\n    float lane = (1.0 - smoothstep(0.05, 0.16, abs(mod(vWP.x + 2.0, 4.0) - 2.0)))\n               * step(ax, 13.0) * step(0.55, fract(wz / 6.0));\n    col += vec3(0.55, 0.58, 0.7) * lane * 0.18;\n    // sidewalk curbs glow\n    col += uNeonA * exp(-abs(ax - 14.5) * 3.0) * 0.35;\n    // cross streets\n    float cz = abs(mod(wz, 84.0) - 7.0);\n    float cross = step(cz, 6.0);\n    col += vec3(0.6, 0.6, 0.7) * cross * step(0.6, fract(vWP.x / 5.0)) * 0.05 * step(ax, 400.0);\n    // wet asphalt: vertical streak reflections of the neon\n    float n = h21(vec2(floor(vWP.x * 0.7), 3.0));\n    float streak = pow(n, 5.0) * (0.55 + 0.45 * sin(wz * 0.045 + n * 40.0 + uTime * 0.3));\n    col += mix(uNeonA, uNeonB, fract(n * 7.0)) * streak * 0.55 * (0.6 + 0.4 * step(13.0, ax));\n    // reflection of the fog / skyline\n    col += uFog * 0.12 * smoothstep(20.0, 300.0, vDist);\n    col = applyFog(col, vDist * 0.7, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "ground.vert": "attribute vec2 aPos;\nuniform mat4 uVP;\nuniform vec3 uEye;\nvarying vec3 vWP;\nvoid main(){\n    vec3 wp = vec3(aPos.x, 0.0, aPos.y);\n    vWP = wp;\n    gl_Position = uVP * vec4(wp, 1.0);\n}\n", "ground_game.frag": "uniform float uCamX;\nuniform float uCamZ;\nuniform float uPitch;   // block pitch (road every uPitch metres)\nuniform float uRoad;    // road width\nvarying vec3 vWP;\n\n/* Game ground: a grid of wet neon streets with lanes, crossings and sidewalks. */\nvoid main(){\n    float vDist = length(vWP - uEye);\n    vec2 w = vWP.xz + vec2(uCamX, uCamZ);                 // world position on the torus\n    vec2 q = mod(w + uPitch * 0.5, uPitch) - uPitch * 0.5; // distance to the nearest road axis (signed)\n    vec2 a = abs(q);\n    float hr = uRoad * 0.5;\n    float onX = step(a.x, hr), onZ = step(a.y, hr);   // inside a road running along z / along x\n    float road = max(onX, onZ);\n    float inter = onX * onZ;\n    vec3 col = vec3(0.012, 0.014, 0.02);\n    // sidewalks and block floor\n    float walk = 1.0 - road;\n    vec2 tl = abs(fract(w * 0.5) - 0.5);\n    col += walk * (vec3(0.028, 0.03, 0.042) + 0.012 * step(0.47, max(tl.x, tl.y)));\n    // curb neon lines\n    float curb = max(onX * (1.0 - onZ) * exp(-abs(a.x - hr) * 4.0), onZ * (1.0 - onX) * exp(-abs(a.y - hr) * 4.0));\n    col += uNeonA * curb * 0.5;\n    // centre double line and dashed lanes (not inside crossings)\n    float alongZ = onX * (1.0 - onZ), alongX = onZ * (1.0 - onX);\n    float centre = alongZ * (1.0 - smoothstep(0.08, 0.16, abs(a.x - 0.25))) + alongX * (1.0 - smoothstep(0.08, 0.16, abs(a.y - 0.25)));\n    col += vec3(1.0, 0.75, 0.25) * centre * 0.35;\n    float lane = alongZ * (1.0 - smoothstep(0.06, 0.14, abs(a.x - 4.6))) * step(0.5, fract(w.y / 6.0))\n               + alongX * (1.0 - smoothstep(0.06, 0.14, abs(a.y - 4.6))) * step(0.5, fract(w.x / 6.0));\n    col += vec3(0.7, 0.75, 0.85) * lane * 0.22;\n    // zebra crossings at the edge of each intersection\n    float zx = onX * step(hr, a.y) * step(a.y, hr + 3.0) * step(0.5, fract(w.x * 0.8));\n    float zz = onZ * step(hr, a.x) * step(a.x, hr + 3.0) * step(0.5, fract(w.y * 0.8));\n    col += vec3(0.6, 0.62, 0.7) * max(zx, zz) * 0.18;\n    // wet asphalt: neon streak reflections\n    // streaks run along the road: thin across, long and slowly varying along\n    float nz = h21(vec2(floor(w.x * 0.8), floor(w.y / 26.0)));\n    float nx = h21(vec2(floor(w.y * 0.8) + 91.0, floor(w.x / 26.0)));\n    float n = alongZ > 0.5 ? nz : nx;\n    float along = alongZ > 0.5 ? w.y : w.x;\n    float streak = pow(n, 6.0) * road * (0.55 + 0.45 * sin(along * 0.07 + n * 40.0));\n    col += mix(uNeonA, uNeonB, fract(n * 7.0)) * streak * 0.5;\n    col += uFog * 0.10 * smoothstep(15.0, 300.0, vDist);\n    col += vec3(0.5, 0.55, 0.7) * uFlash * 0.15;\n    col = applyFog(col, vDist * 0.8, 0.0);\n    gl_FragColor = vec4(col, 1.0);\n}\n", "mist.frag": "uniform float uMist;\nuniform vec2 uRes;\nvarying vec2 vUV;\n/* Drifting ground mist / fog banks over the whole frame (alpha-blended). */\nvoid main(){\n    vec2 p = vUV * vec2(uRes.x / uRes.y, 1.0);\n    float n1 = fbm(p * 2.2 + vec2(uTime * 0.035, uTime * 0.008));\n    float n2 = fbm(p * 4.5 - vec2(uTime * 0.06, -uTime * 0.01) + n1);\n    float band = smoothstep(0.85, 0.15, vUV.y);           // denser low, near the street\n    float m = (n1 * 0.65 + n2 * 0.45) * (0.45 + 0.75 * band);\n    m = smoothstep(0.18, 0.8, m) * uMist;\n    vec3 col = uFog * 1.7 + vec3(0.05) + uNeonA * 0.03 + vec3(0.6, 0.65, 0.8) * uFlash;\n    gl_FragColor = vec4(col, m * 0.92);\n}\n", "particle.frag": "varying vec4 vCol;\nvarying float vKind;\nvarying float vSeed;\n/* Exhaust particles drawn as point sprites: soft turbulent smoke puffs (alpha blended)\n   and backfire flames (additive: white-blue core, orange tongue). */\nvoid main(){\n    vec2 q = gl_PointCoord * 2.0 - 1.0;\n    float r = length(q);\n    if (r > 1.0) discard;\n    if (vKind < 0.5) {\n        float n = vnoise(q * 2.6 + vSeed * 31.0) * 0.6 + vnoise(q * 5.3 - vSeed * 17.0) * 0.4;\n        float a = (1.0 - smoothstep(0.25, 1.0, r)) * (0.45 + 0.75 * n) * vCol.a;\n        gl_FragColor = vec4(vCol.rgb * (0.8 + 0.4 * n), a);\n    } else {\n        float n = vnoise(q * 3.0 + vec2(vSeed * 40.0, uTime * 9.0));\n        float core = exp(-r * r * 9.0);\n        float tongue = (1.0 - smoothstep(0.2, 1.0, r + (n - 0.5) * 0.5));\n        vec3 c = vCol.rgb * tongue * 0.9 + vec3(0.6, 0.75, 1.0) * core * 0.7;\n        gl_FragColor = vec4(c * vCol.a, 1.0);\n    }\n}\n", "particle.vert": "attribute vec3 aPos;\nattribute vec4 aCol;\nattribute vec2 aInfo;        // x: size in metres, y: kind (0 smoke, 1 flame) + seed * 0.9\nuniform mat4 uVP;\nuniform float uScale;        // viewport height / (2 tan(fov / 2))\nvarying vec4 vCol;\nvarying float vKind;\nvarying float vSeed;\nvoid main(){\n    gl_Position = uVP * vec4(aPos, 1.0);\n    gl_PointSize = clamp(aInfo.x * uScale / max(gl_Position.w, 0.05), 1.0, 300.0);\n    vCol = aCol;\n    vKind = floor(aInfo.y);\n    vSeed = fract(aInfo.y) / 0.9;\n}\n", "post.frag": "uniform float uFade;\nuniform float uScan;\nuniform vec2 uRes;\nvarying vec2 vUV;\n/* Vignette, CRT scanlines and fade-to-black (alpha-blended over the frame). */\nvoid main(){\n    vec2 p = vUV - 0.5;\n    float vig = smoothstep(0.35, 0.85, length(p * vec2(1.0, 0.85)));\n    float scan = uScan * 0.18 * step(0.5, fract(vUV.y * uRes.y / 3.0));\n    float a = clamp(max(uFade, vig * 0.75 + scan), 0.0, 1.0);\n    gl_FragColor = vec4(0.0, 0.0, 0.0, a);\n}\n", "post.vert": "attribute vec2 aPos;\nvarying vec2 vUV;\nvoid main(){\n    vUV = aPos * 0.5 + 0.5;\n    gl_Position = vec4(aPos, 0.0, 1.0);\n}\n", "rain.frag": "uniform float uRain;\nuniform float uSnow;\nvarying vec2 vC;\nvarying float vDist;\nvoid main(){\n    float a = (1.0 - abs(vC.y)) * smoothstep(0.0, 0.4, vC.x) * uRain;\n    a *= smoothstep(1.0, 5.0, vDist) * (1.0 - smoothstep(30.0, 70.0, vDist));\n    vec3 col = mix(vec3(0.6, 0.7, 0.85), uFog * 2.2 + uNeonA * 0.2, 0.4);\n    if (uSnow > 0.5) {\n        a = (1.0 - abs(vC.y)) * (1.0 - abs(vC.x * 2.0 - 1.0)) * uRain;\n        a *= smoothstep(0.5, 3.0, vDist) * (1.0 - smoothstep(25.0, 60.0, vDist));\n        col = vec3(0.9, 0.93, 1.0) + uNeonA * 0.08;\n        gl_FragColor = vec4(col * a * 0.9, 1.0);\n        return;\n    }\n    col += vec3(0.6) * uFlash;\n    gl_FragColor = vec4(col * a * 0.35, 1.0);\n}\n", "rain.vert": "attribute vec3 aSeed;\nattribute vec2 aCorner;\nuniform mat4 uV;\nuniform mat4 uP;\nuniform vec3 uEye;\nuniform float uTime;\nuniform float uCamZ;\nuniform float uRainSpeed;\nuniform float uSnow;\nuniform float uWind;\nvarying vec2 vC;\nvarying float vDist;\nvoid main(){\n    vec3 pos;\n    pos.x = uEye.x + (aSeed.x - 0.5) * 70.0;\n    float fall = uRainSpeed * (0.8 + aSeed.z * 0.4) * mix(1.0, 0.07, uSnow);\n    pos.y = uEye.y - 25.0 + mod(aSeed.y * 60.0 - uTime * fall, 60.0);\n    pos.z = mod(aSeed.z * 84.0 - uCamZ, 84.0) - 4.0;\n    pos.x += uSnow * sin(uTime * (0.6 + aSeed.x) + aSeed.y * 30.0) * 1.2 + uWind * 0.02 * mod(uTime * 7.0 + aSeed.z * 50.0, 60.0);\n    vec3 vel = mix(vec3(-0.08 - uWind * 0.02, -1.0, 0.0), vec3(0.0, -0.06, 0.0), uSnow);\n    vec3 a = (uV * vec4(pos, 1.0)).xyz;\n    vec3 b = (uV * vec4(pos + vel * 0.9, 1.0)).xyz;\n    vec3 seg = b - a;\n    vec3 P = mix(a, b, aCorner.x);\n    vec3 perp = cross(seg, P);\n    float pl = length(perp);\n    perp = pl > 1e-4 ? perp / pl : vec3(1.0, 0.0, 0.0);\n    P += perp * aCorner.y * mix(0.018, 0.05, uSnow) + (uSnow > 0.5 ? normalize(seg + vec3(1e-4)) * (aCorner.x * 2.0 - 1.0) * 0.04 : vec3(0.0));\n    vC = aCorner;\n    vDist = length(P);\n    gl_Position = uP * vec4(P, 1.0);\n}\n", "sky.frag": "uniform vec3 uSunDir;\nuniform vec3 uSunCol;\nuniform float uSunStripes;\nuniform float uCloud;\nvarying vec3 vDir;\n\nvoid main(){\n    vec3 d = normalize(vDir);\n    float y = d.y;\n    vec3 col = mix(uFog * 1.15, uSkyTop, smoothstep(-0.05, 0.55, y));\n    // stars\n    vec2 sp = d.xz / (abs(y) + 0.25) * 260.0;\n    float st = step(0.9965, h21(floor(sp)));\n    col += (1.0 - uCloud) * vec3(0.8, 0.85, 1.0) * st * smoothstep(0.12, 0.5, y) * (0.5 + 0.5 * sin(uTime * 3.0 + h21(floor(sp) + 3.0) * 40.0));\n    // moon / sun\n    float dd = distance(d, normalize(uSunDir));\n    float disk = smoothstep(0.075, 0.070, dd) * (1.0 - 0.75 * uCloud);\n    if (uSunStripes > 0.5) {\n        float sy = (d.y - uSunDir.y) / 0.075;\n        float stripe = step(0.0, sin(sy * 26.0 + uTime * 1.5)) + s function rng(seed) {

    board: prog('billboard.vert', 'billboard.frag'), car: prog('car.vert', 'car.frag'), rain: prog('rain.vert', 'rain.frag'), post: prog('post.vert', 'post.frag'), mist: prog('post.vert', 'mist.frag')

    building: mesh({ aPos: [c.B.pos, 3], aCenter: [c.B.center, 2], aNorm: [c.B.norm, 3], aUV: [c.B.uv, 2], aMisc: [c.B.misc, 4] }, c.B.idx),
    board: mesh({ aPos: [c.BB.pos, 3], aCenter: [c.BB.center, 2], aUV: [c.BB.uv, 2], aMisc: [c.BB.misc, 4] }, c.BB.idx),
    car: mesh({ aLane: [c.C.lane, 4], aDir: [c.C.dir, 4], aCorner: [c.C.corner, 2] }, c.C.idx),
    rain: mesh({ aSeed: [c.RN.seed, 3], aCorner: [c.RN.corner, 2] }, c.RN.idx),

  this.t += dt;
  // lightning: random double flashes
  this.flash = Math.max(0, this.flash - dt * 3.5);

  const rainAmt = wx ? wx.rain : o.rain, fogDen = pal.fogDen * (wx ? wx.fog : 1);
  const t = this.t;

  let mode = o.mode;
  if (mode === 'auto') {
    this.modeT += dt;
    const period = o.cycle || 45;
    if (this.modeT > period) { this.modeT = 0; this.modeIdx = (this.modeIdx + 1) % MODES.length; }
    mode = MODES[this.modeIdx];

  const cam = cameraFor(mode, t);

  if (wx && wx.mist > 0) { gl.disable(gl.DEPTH_TEST); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.useProgram(P.mist.p); set(P.mist);

  gl.disable(gl.DEPTH_TEST); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  gl.depthMask(true); gl.disable(gl.BLEND);
};

window.Cybercity = Cybercity;
window.CYBER_PALETTES = PALETTES;
window.CYBER_WEATHER = WEATHER;
window.CYBER_MODES = MODES;
window.CYBER_MODE_NAMES = MODE_NAMES;
})();
</script>
<script>
(function(){
  const DEF={weather:'',palette:'neon',mode:'auto',speed:1,rain:0.55,traffic:true,scanlines:false,clockOn:true,quality:'0.85',seed:2077,cycle:45};
  let o=Object.assign({},DEF);
  try{Object.assign(o,JSON.parse(localStorage.getItem('cybercity')||'{}'));}catch(e){}
  const q=new URLSearchParams(location.search);
  for(const k of Object.keys(DEF)){ if(q.has(k)){ const v=q.get(k); o[k]=typeof DEF[k]==='number'?parseFloat(v):typeof DEF[k]==='boolean'?v!=='0'&&v!=='false':v; } }
  const save=()=>{try{localStorage.setItem('cybercity',JSON.stringify(o));}catch(e){}};
  const cv=document.getElementById('c');
  let city;
  try{ city=new Cybercity(cv,{get palette(){return o.palette},get mode(){return o.mode},get speed(){return o.speed},get rain(){return o.rain},get weather(){return o.weather},
      get traffic(){return o.traffic?1:0},get scanlines(){return o.scanlines},get cycle(){return o.cycle},seed:o.seed,preserve:q.has('shot')}); }
  catch(e){ const er=document.getElementById('err'); er.style.display='flex'; er.textContent='Errore WebGL: '+e.message; console.error(e); return; }
  window.__city=city;
  function resize(){ const s=parseFloat(o.quality)*Math.min(window.devicePixelRatio||1,2); cv.width=Math.round(innerWidth*s); cv.height=Math.round(innerHeight*s); }
  addEventListener('resize',resize); resize();
  // settings UI
  const $=id=>document.getElementById(id);
  for(const k in CYBER_PALETTES){ const op=document.createElement('option'); op.value=k; op.textContent=CYBER_PALETTES[k].name; $('palette').appendChild(op); }
  { const op=document.createElement('option'); op.value=''; op.textContent='SPENTO (usa pioggia)'; $('weather').appendChild(op);
    for(const k in CYBER_WEATHER){ const w=document.createElement('option'); w.value=k; w.textContent=CYBER_WEATHER[k].name; $('weather').appendChild(w); } }
  const am=document.createElement('option'); am.value='auto'; am.textContent='AUTO (ciclo)'; $('mode').appendChild(am);
  for(const m of CYBER_MODES){ const op=document.createElement('option'); op.value=m; op.textContent=CYBER_MODE_NAMES[m]; $('mode').appendChild(op); }
  const bind=(id,prop,kind)=>{ const el=$(id); if(kind==='check') el.checked=!!o[prop]; else el.value=o[prop];
    el.addEventListener('input',()=>{ o[prop]=kind==='check'?el.checked:kind==='num'?parseFloat(el.value):el.value; save(); if(prop==='quality')resize(); applyAccent(); }); };
  bind('palette','palette'); bind('weather','weather'); bind('mode','mode'); bind('speed','speed','num'); bind('rain','rain','num'); bind('traffic','traffic','check');
  bind('scanlines','scanlines','check'); bind('clockOn','clockOn','check'); bind('quality','quality');
  function applyAccent(){ const p=CYBER_PALETTES[o.palette]||CYBER_PALETTES.neon; const c=p.neonA.map(v=>Math.round(v*255)); document.body.style.setProperty('--a','rgb('+c+')');
    $('hud').style.display=o.clockOn?'block':'none'; }

  $('gear').onclick=e=>{e.stopPropagation();$('panel').classList.toggle('open');};
  $('panel').onclick=e=>e.stopPropagation();

  addEventListener('mousemove',active); addEventListener('touchstart',active);

    if(e.key===' '){ const all=['auto',...CYBER_MODES]; o.mode=all[(all.indexOf(o.mode)+1)%all.length]; $('mode').value=o.mode; city.fade=1; save(); }
    if(e.key==='p'||e.key==='P'){ const ks=Object.keys(CYBER_PALETTES); o.palette=ks[(ks.indexOf(o.palette)+1)%ks.length]; $('palette').value=o.palette; applyAccent(); save(); }
  });
  // glitch clock
  const GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&@*+=<>/|ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ';
  const ck=$('clock'), dt=$('date'); let last='', lockAt=[], burst=0;
  const days=['DOMENICA','LUNEDÌ','MARTEDÌ','MERCOLEDÌ','GIOVEDÌ','VENERDÌ','SABATO'];
  function clockFrame(now){
    const d=new Date(), s=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    if(s!==last){ last=s; lockAt=[...s].map((_,i)=>now+90*i+Math.random()*250); burst=now+300; }
    if(Math.random()<0.004) burst=now+120+Math.random()*200;
    const shown=[...s].map((ch,i)=>ch===':'||now>=lockAt[i]?ch:GL[Math.floor(Math.random()*GL.length)]).join('');

    const g=now<burst, sp=g?(2+Math.random()*6):1.2;

      '<span style="color:'+cb+';transform:translateX(-'+sp+'px);opacity:.7">'+shown+'</span>'+
      '<span style="color:'+ca+';transform:translateX('+sp+'px);opacity:.7">'+shown+'</span>'+
      '<span style="color:#ecfcff;'+(g?'clip-path:inset('+(Math.random()*60|0)+'% 0 '+(Math.random()*30|0)+'% 0);transform:translateX('+((Math.random()-.5)*14)+'px)':'')+'">'+shown+'</span>';
    dt.textContent=days[d.getDay()]+' · '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  }

    if(o.clockOn) clockFrame(now);
    requestAnimationFrame(loop);
  }
  if(q.has('t')) { const T=parseFloat(q.get('t')); for(let i=0;i<T*10;i++) city.frame(0.1); }
  if(shot){ city.frame(1/30); if(o.clockOn) clockFrame(performance.now()); $('modeName').textContent=(CYBER_PALETTES[o.palette]||{}).name+' · '+CYBER_MODE_NAMES[city.curMode]; window.__done=true; }
  else requestAnimationFrame(loop);
})();
