<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AMPY KAGE GT — Showroom</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#ecfcff;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #title{position:fixed;left:3vmin;top:3vmin;pointer-events:none}
  #title h1{margin:0;font-size:4.2vmin;letter-spacing:.25em;color:var(--a);text-shadow:0 0 14px var(--a)}
  #title div{font-size:1.8vmin;letter-spacing:.3em;opacity:.7}
  #bar{position:fixed;left:0;right:0;bottom:2.5vmin;display:flex;flex-wrap:wrap;gap:1.2vmin;justify-content:center;padding:0 2vmin}
  button{background:rgba(7,11,19,.7);color:#ecfcff;border:1px solid var(--a);border-radius:2vmin;padding:1.2vmin 2vmin;font:bold 1.8vmin monospace;letter-spacing:.08em}
  button.on{background:var(--a);color:#070b13}
  #specs{position:fixed;right:3vmin;top:3vmin;width:min(46vmin,420px);background:rgba(7,11,19,.82);border:1px solid var(--a);padding:2vmin 2.4vmin;
    font-size:1.6vmin;line-height:1.55;display:none;backdrop-filter:blur(6px)}
  #specs.open{display:block}
  #specs b{color:var(--a);display:block;font-size:1.3vmin;letter-spacing:.2em;margin-top:1vmin}
  button.rev{border-color:#ff7a2e;color:#ffd2b0}
  button.rev.on{background:#ff7a2e;color:#070b13}
  #rpm{position:fixed;right:3vmin;top:12vmin;font:bold 3vmin monospace;color:var(--a);text-shadow:0 0 10px var(--a);pointer-events:none}
  #cust{position:fixed;left:3vmin;top:14vmin;width:min(52vmin,440px);display:none;flex-wrap:wrap;gap:1vmin;background:rgba(7,11,19,.82);border:1px solid var(--a);padding:1.6vmin}
  #cust.open{display:flex}
  #cust b{width:100%;color:var(--a);letter-spacing:.2em;font-size:1.5vmin}
  #cust input{flex:1;background:#070b13;color:#ecfcff;border:1px solid var(--a);padding:1vmin;font:bold 1.6vmin monospace;text-transform:uppercase}
  #cInfo{width:100%;font-size:1.4vmin;opacity:.75}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ff6177}
  #vsel{position:fixed;left:50%;top:2.5vmin;transform:translateX(-50%);display:flex;gap:0.8vmin;flex-wrap:wrap;justify-content:center;max-width:70vw}
  #fcust{position:fixed;left:3vmin;top:14vmin;width:min(52vmin,440px);display:none;flex-wrap:wrap;gap:1vmin;background:rgba(7,11,19,.82);border:1px solid var(--a);padding:1.6vmin}
  #fcust.open{display:flex}
  #fcust b{width:100%;color:var(--a);letter-spacing:.2em;font-size:1.5vmin}
  body.fleet .caronly{display:none} .fleetonly{display:none} body.fleet .fleetonly{display:inline-block} body.kpil .fleetonly{display:none}
</style>
</head>
<body style="--a:#00ffe2">
<canvas id="c"></canvas>
<div id="title"><h1>AMPY KAGE GT</h1><div>SHOWROOM · CYBERCITY 3D</div></div>
<div id="specs"></div>
<div id="vsel"><button data-v="car" class="on">KAGE GT</button><button data-v="moto">🏍 VOLT</button><button data-v="drone">🚁 STRIX</button><button data-v="hover">🛸 GLIDE</button><button data-v="boat">🚤 RIPTIDE</button><button data-v="sub">🤿 ABYSS</button><button data-v="galleon">⛵ LEVIATHAN</button><button data-v="pilot">🧑‍🚀 PILOTA</button><button data-v="alien">👽 ALIENI</button><button data-v="ufo">🛸 XENO</button><button data-v="chrono">⏳ EPOCH</button><button data-v="starship">🚀 ODYSSEY</button></div>
<div id="fcust"></div>
<div id="bar">
  <button id="bTurn" class="on">⟳ RUOTA</button><button class="caronly" id="bHood">COFANO</button><button class="caronly" id="bDoors">PORTIERE</button>
  <button class="caronly" id="bInt">INTERNI</button><button id="bCock">ABITACOLO</button><button class="caronly" id="bEng">MOTORE</button>
  <button class="caronly" id="bSteer">STERZO</button><button class="caronly on" id="bLights">LUCI</button><button class="caronly" id="bPaint">COLORE</button>
  <button id="bPal">ATMOSFERA</button><button id="bSpecs">SCHEDA TECNICA</button>
  <button class="caronly" id="bRoof">CAPOTE: CHIUSA</button><button class="caronly" id="bPower">V8 BITURBO IBRIDO</button><button class="caronly" id="bExh">SCARICO: SERIE</button><button class="caronly" id="bChrono">MODULO CRONO</button><button class="caronly" id="bFly">VOLO</button><button id="bCustom">🎨 PERSONALIZZA</button><button id="bQual">RISOLUZIONE: ALTA</button><button id="bSpots" class="on">💡 RIFLETTORI: ON</button><button class="fleetonly" id="bFSnd">🔊 SUONO: OFF</button><button class="fleetonly rev" id="bFRev">⚡ A TUTTA POTENZA</button><button class="caronly on" id="bMotor">MOTORE ON</button><button class="caronly rev" id="bRev">🔥 SU DI GIRI</button>
</div>
<div id="err"></div>
<div id="cust"><b>PERSONALIZZAZIONE</b>
  <button id="cKit">KIT: SERIE</button><button id="cRim">CERCHI: A</button><button id="cRimC">COLORE CERCHI</button>
  <button id="cLiv">LIVREA: NESSUNA</button><button id="cStr">COLORE LIVREA</button><button id="cTxt">SCRITTA: NESSUNA</button>
  <input id="cTxtIn" maxlength="12" placeholder="SCRITTA PERSONALIZZATA"><button id="cTxtOk">APPLICA</button><button id="cBrk">FRENI</button>
  <div id="cInfo">TARGA: KAGE 2789 GT</div></div>
<div id="rpm"></div>
<script>/*SHADERS*/</script>
<script>/*ENGINE*/</script>
<script>/*CARHD*/</script>
<script>/*CARRENDER*/</script>
<script>/*ENGINEFX*/</script>
<script>/*SHOWROOM*/</script>
<script>/*SFLEET*/</script>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const o={quality:q.get('quality')||(()=>{try{return localStorage.getItem('kageQuality')}catch(e){return null}})()||'ultra',palette:q.get('palette')||'neon',paint:q.get('paint')||'nero',power:q.get('power')||'v8',exhaust:q.get('exhaust')||'serie',chrono:q.has('chrono'),preserve:q.has('shot')};
  const cv=document.getElementById('c'); let sr;
  try{ sr=new Showroom(cv,o); }catch(e){ const er=document.getElementById('err'); er.style.display='flex'; er.textContent='Errore: '+e.message; console.error(e); return; }
  window.__sr=sr;
  function resize(){ const s=Math.min(devicePixelRatio||1,2); cv.width=Math.round(innerWidth*s); cv.height=Math.round(innerHeight*s); } addEventListener('resize',resize); resize();
  const $=id=>document.getElementById(id);
  let S=CarHD.SPECS_BY[o.power]||CarHD.SPECS; const specs=()=>{ S=CarHD.SPECS_BY[o.power]; const rows=[['MOTORE',S.engine],['POTENZA',S.power],['COPPIA',S.torque],['REGIME MAX',S.redline],['TRASMISSIONE',S.gearbox],['ACCELERAZIONE',S.accel],
    ['VELOCITÀ MAX',S.vmax],['FRENATA',S.braking],['PESO',S.weight],['AERODINAMICA',S.aero],['DIMENSIONI',S.dims],['PNEUMATICI',S.tyres],['BATTERIA',S.battery]];
  if(sr.F&&sr.F.kind){ const K=sr.F.kind==='pilot'?{title:'PILOTA KAGE'}:KageFleet.KINDS[sr.F.kind]; $('specs').innerHTML='<div style="font-size:2.4vmin;letter-spacing:.2em">'+K.title+'</div>'+Showroom.FLEET_SPECS[sr.F.kind](sr.F.cfg).map(r=>'<b>'+r[0]+'</b>'+r[1]).join(''); $('title').querySelector('h1').textContent=K.title; return; }
    $('specs').innerHTML='<div style="font-size:2.4vmin;letter-spacing:.2em">'+S.name+'</div>'+rows.map(r=>'<b>'+r[0]+'</b>'+r[1]).join(''); $('title').querySelector('h1').textContent=S.name; }; specs();
  const accent=()=>{ const p=CYBER_PALETTES[o.palette]; document.body.style.setProperty('--a','rgb('+p.neonA.map(v=>v*255|0)+')'); }; accent();
  const tog=(id,on)=>$(id).classList.toggle('on',on);
  const mode=m=>{ sr.cam.mode=sr.cam.mode===m?'orbit':m; tog('bInt',sr.cam.mode==='interior'); tog('bCock',sr.cam.mode==='cockpit'); tog('bEng',sr.cam.mode==='engine');
    if(sr.cam.mode==='engine'){ sr.tg.hood=1; tog('bHood',true);} if(sr.cam.mode==='interior'){ sr.tg.doors=1; tog('bDoors',true);} };
  $('bTurn').onclick=()=>{ sr.cam.auto=!sr.cam.auto; tog('bTurn',sr.cam.auto); };
  $('bHood').onclick=()=>{ sr.tg.hood=sr.tg.hood?0:1; tog('bHood',!!sr.tg.hood); };
  $('bDoors').onclick=()=>{ sr.tg.doors=sr.tg.doors?0:1; tog('bDoors',!!sr.tg.doors); };
  $('bInt').onclick=()=>mode('interior'); $('bCock').onclick=()=>mode('cockpit'); $('bEng').onclick=()=>mode('engine');
  $('bSteer').onclick=()=>{ sr.tg.steerDemo=!sr.tg.steerDemo; tog('bSteer',sr.tg.steerDemo); };
  $('bLights').onclick=()=>{ sr.tg.lights=sr.tg.lights?0:1; tog('bLights',!!sr.tg.lights); };
  $('bPaint').onclick=()=>{ const ks=Object.keys(CarRenderUtil.PAINTS); o.paint=ks[(ks.indexOf(o.paint)+1)%ks.length]; };
  $('bPal').onclick=()=>{ const ks=Object.keys(CYBER_PALETTES); o.palette=ks[(ks.indexOf(o.palette)+1)%ks.length]; accent(); };
  $('bSpecs').onclick=()=>{ $('specs').classList.toggle('open'); tog('bSpecs',$('specs').classList.contains('open')); };
  $('bRoof').onclick=()=>{ sr.tg.roof=sr.tg.roof?0:1; $('bRoof').textContent=sr.tg.roof?'CAPOTE: APERTA (SPIDER)':'CAPOTE: CHIUSA'; tog('bRoof',!!sr.tg.roof); };
  $('bExh').onclick=()=>{ o.exhaust=o.exhaust==='race'?'serie':'race'; $('bExh').textContent=o.exhaust==='race'?'SCARICO: ELABORATO':'SCARICO: SERIE'; tog('bExh',o.exhaust==='race'); };
  $('bChrono').onclick=()=>{ o.chrono=!o.chrono; tog('bChrono',o.chrono); };
  $('bFly').onclick=()=>{ if(o.power!=='mag'){ o.power='mag'; $('bPower').textContent=CarHD.POWER[o.power]; specs(); } sr.tg.fly=sr.tg.fly?0:1; tog('bFly',!!sr.tg.fly); };
  const PW=['v8','wankel','mag']; $('bPower').textContent=CarHD.POWER[o.power];
  $('bPower').onclick=()=>{ o.power=PW[(PW.indexOf(o.power)+1)%PW.length]; $('bPower').textContent=CarHD.POWER[o.power]; specs(); sr.eng.rpm=sr.eng.T.idle; };
  // customisation (shared with the game through localStorage)
  const C=sr.carCfg=kageLoad(), presets=CarHD.RIG.textPresets, colK=Object.keys(KAGE_COLORS);
  const lbl=()=>{ $('cKit').textContent='KIT: '+['SERIE','WIDEBODY I','WIDEBODY II GT'][C.kit]; $('cRim').textContent='CERCHI: '+{A:'SERIE',B:'FORGED Y',C:'TURBOFAN'}[C.rim];
    $('cRimC').textContent='COLORE CERCHI: '+C.rimcol.toUpperCase(); $('cLiv').textContent='LIVREA: '+['NESSUNA','DOPPIA STRISCIA','LATERALE'][C.livery];
    $('cStr').textContent='COLORE LIVREA: '+C.stripe.toUpperCase(); $('cTxt').textContent='SCRITTA: '+(C.text==='none'?'NESSUNA':C.text==='C'?C.customText:presets[+C.text]);
    $('cBrk').textContent='FRENI: '+KAGE_BRAKES[C.brakes].name; kageSave(C); };
  { const QN={low:'BASSA',high:'ALTA',ultra:'ALTISSIMA'}, QK=['low','high','ultra'], ql=()=>{ $('bQual').textContent='RISOLUZIONE: '+QN[sr.quality]; };
    ql(); $('bQual').onclick=()=>{ $('bQual').textContent='…'; setTimeout(()=>{ sr.setQuality(QK[(QK.indexOf(sr.quality)+1)%3]); try{localStorage.setItem('kageQuality',sr.quality);}catch(e){} ql(); },30); }; }
  // the whole KAGE line-up: vehicle selector + fleet customisation panel
  const fcust=$('fcust');
  const fpanel=()=>{ if(!sr.F||!sr.F.kind) return; const k=sr.F.kind, PIL=k==='pilot', K=PIL?{title:'PILOTA KAGE',opts:KagePilot.OPTS}:KageFleet.KINDS[k]; let h='<b>'+K.title+' · PERSONALIZZA</b>';
    for(const key in K.opts) h+='<button data-o="'+key+'">'+(PIL?KagePilot.TITLES[key]:KageFleet.OPT_TITLES[key])+': '+(PIL?KagePilot.label(key,sr.F.cfg[key]):KageFleet.optLabel(k,key,sr.F.cfg[key]))+'</button>';
    if(PIL) h+='<button data-inv="1">A BORDO DEI VEICOLI: '+(sr.F.cfg.inVehicle===false?'NO':'SÌ')+'</button>';
    if(PIL) h+='<button data-mine="1">👤 IL MIO PILOTA</button>';
    h+='<button data-rnd="1">🎲 CASUALE</button>'; fcust.innerHTML=h;
    fcust.querySelectorAll('button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const d=b.dataset;
      if(d.o){ const O=K.opts[d.o], i=O.indexOf(sr.F.cfg[d.o]); sr.F.cfg[d.o]=O[(i+1)%O.length]; }
      if(d.inv) sr.F.cfg.inVehicle=sr.F.cfg.inVehicle===false;
      if(d.mine){ sr.F.cfg=Object.assign({},KagePilot.MINE,{pose:sr.F.cfg.pose,inVehicle:sr.F.cfg.inVehicle}); }
      if(d.rnd){ if(PIL){ const r={}; for(const key in KagePilot.OPTS){ const O=KagePilot.OPTS[key]; r[key]=O[Math.random()*O.length|0]; } r.inVehicle=sr.F.cfg.inVehicle; sr.F.cfg=r; } else sr.F.cfg=KageFleet.randomCfg(k); }
      if(PIL) KagePilot.save(sr.F.cfg); else KageFleet.saveCfg(k,sr.F.cfg); sr.rebuildFleet(); fpanel(); specs(); }); };
  const pickV=v=>{ document.querySelectorAll('#vsel button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    sr.setVehicle(v); document.body.classList.toggle('fleet',v!=='car'); document.body.classList.toggle('kpil',v==='pilot'||v==='alien'); if(v!=='car'&&sr.tg.engine) $('bMotor').onclick();
    if(v!=='car'){ sr.tg.engine=false; sr.audio.on=false; $('cust').classList.remove('open'); if(sr.cam.mode!=='orbit'&&sr.cam.mode!=='cockpit') sr.cam.mode='orbit'; } else { fcust.classList.remove('open'); }
    tog('bCock',sr.cam.mode==='cockpit'); fpanel(); specs(); };
  document.querySelectorAll('#vsel button').forEach(b=>b.onclick=e=>{ e.stopPropagation(); pickV(b.dataset.v); });
  $('bCustom').onclick=()=>{ const p=sr.F&&sr.F.kind?fcust:$('cust'); p.classList.toggle('open'); tog('bCustom',p.classList.contains('open')); };
  $('cKit').onclick=()=>{ C.kit=(C.kit+1)%3; lbl(); }; $('cRim').onclick=()=>{ C.rim={A:'B',B:'C',C:'A'}[C.rim]; lbl(); };
  $('cRimC').onclick=()=>{ C.rimcol=colK[(colK.indexOf(C.rimcol)+1)%colK.length]; lbl(); }; $('cLiv').onclick=()=>{ C.livery=(C.livery+1)%3; lbl(); };
  $('cStr').onclick=()=>{ C.stripe=colK[(colK.indexOf(C.stripe)+1)%colK.length]; lbl(); };
  $('cTxt').onclick=()=>{ const seq=['none','0','1','2','3']; C.text=seq[(seq.indexOf(String(C.text))+1)%seq.length]; lbl(); };
  $('cTxtOk').onclick=()=>{ const t=($('cTxtIn').value||'').toUpperCase().replace(/[^A-Z0-9 .\-]/g,'').slice(0,12); if(!t) return; C.customText=t; C.text='C'; sr.car.replaceParts(CarHD.buildText(t)); lbl(); };
  $('cBrk').onclick=()=>{ C.brakes=(C.brakes+1)%KAGE_BRAKES.length; lbl(); };
  if(C.text==='C') sr.car.replaceParts(CarHD.buildText(C.customText)); lbl();
  // engine sound starts with the first touch (browser rule), SU DI GIRI: hold to rev, release for the crackle
  const snd=()=>sr.audio.start(); addEventListener('pointerdown',snd); addEventListener('keydown',snd);
  $('bMotor').onclick=()=>{ sr.tg.engine=!sr.tg.engine; tog('bMotor',sr.tg.engine); $('bMotor').textContent=sr.tg.engine?'MOTORE ON':'MOTORE OFF';
    if(sr.tg.engine){ sr.eng.rpm=300; sr.tg.rev=0.45; setTimeout(()=>{ if(!revHeld) sr.tg.rev=0; },260); } };
  let revHeld=false;
  // studio spotlights (saved), fleet sound demo
  try{ sr.spots=localStorage.getItem('kageSpots')!=='0'; }catch(e){ sr.spots=true; }
  const spl=()=>{ $('bSpots').textContent='💡 RIFLETTORI: '+(sr.spots?'ON':'OFF'); tog('bSpots',sr.spots); }; spl();
  $('bSpots').onclick=()=>{ sr.spots=!sr.spots; try{localStorage.setItem('kageSpots',sr.spots?'1':'0');}catch(e){} spl(); };
  $('bFSnd').onclick=()=>{ sr.fleetSnd=!sr.fleetSnd; tog('bFSnd',sr.fleetSnd); $('bFSnd').textContent='🔊 SUONO: '+(sr.fleetSnd?'ON':'OFF'); };
  const frev=on=>{ if(on&&!sr.fleetSnd) $('bFSnd').onclick(); sr.fleetRev=on; tog('bFRev',on); };
  $('bFRev').addEventListener('pointerdown',e=>{ e.stopPropagation(); frev(true); });
  for(const ev of ['pointerup','pointerleave','pointercancel']) $('bFRev').addEventListener(ev,()=>frev(false));
  const rev=on=>{ revHeld=on; if(on&&!sr.tg.engine) $('bMotor').onclick(); sr.tg.rev=on?1:0; tog('bRev',on); };
  $('bRev').addEventListener('pointerdown',e=>{ e.stopPropagation(); snd(); rev(true); });
  for(const ev of ['pointerup','pointerleave','pointercancel']) $('bRev').addEventListener(ev,()=>rev(false));
  addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat){ if(sr.F&&sr.F.kind) frev(true); else rev(true); } });
  addEventListener('keyup',e=>{ if(e.code==='Space'){ rev(false); frev(false); } });
  setInterval(()=>{ $('rpm').textContent=sr.tg.engine?(Math.round(sr.eng.rpm/50)*50)+' RPM':''; },80);
  // ?demo=1 → screensaver turnaround: random configuration + camera every 9-14 s, no UI, no sound
  if(q.has('demo')){
    sr.audio.start=()=>{}; document.body.classList.add('demo');
    for(const id of ['bar','title','specs','rpm','cust']) { const el=$(id); if(el) el.style.display='none'; }
    const st=document.createElement('style'); st.textContent='.demo #langPill,.demo .lang-pill{display:none!important}'; document.head.appendChild(st);
    const pick=a=>a[Math.random()*a.length|0], cams=['orbit','orbit','orbit','orbit','orbit','orbit','interior','cockpit','engine'];
    let spin=0.25, tDist=7.2, tPitch=0.18, dt0=0;
    const shuffle=()=>{
      // a fleet vehicle now and then
      if(Math.random()<0.4){ const k=pick(['drone','boat','galleon']); sr.setVehicle(k,KageFleet.randomCfg(k)); sr.cam.auto=false; sr.cam.mode=Math.random()<0.85?'orbit':'cockpit'; sr.cam.look=0; sr.cam.lookP=0;
        const base={drone:4.6,boat:13,galleon:52}[k]; spin=(Math.random()<0.5?-1:1)*(0.1+Math.random()*0.22); tDist=base*(0.75+Math.random()*0.6); tPitch=0.04+Math.random()*0.42; sr.cam.yaw=0.7; sr.turn=Math.random()*6.283; sr.cam.dist=tDist;
        setTimeout(shuffle,9000+Math.random()*5000); return; }
      sr.setVehicle('car');
      o.paint=pick(Object.keys(CarRenderUtil.PAINTS)); o.power=pick(PW); o.exhaust=Math.random()<0.5?'race':'serie'; o.chrono=Math.random()<0.3;
      sr.carCfg={kit:Math.random()*3|0,rim:pick(['A','B','C']),livery:Math.random()*3|0,text:Math.random()<0.4?'none':String(Math.random()*4|0),customText:'KAGE GT',
        stripe:pick(colK),rimcol:pick(colK),brakes:Math.random()*KAGE_BRAKES.length|0};
      sr.tg.roof=Math.random()<0.3?1:0; sr.tg.fly=o.power==='mag'&&Math.random()<0.4?1:0; sr.tg.lights=Math.random()<0.8?1:0;
      const r=Math.random(); sr.tg.hood=r<0.15?1:0; sr.tg.doors=r>0.15&&r<0.32?1:0; sr.tg.steerDemo=Math.random()<0.3;
      sr.cam.mode=pick(cams); if(sr.cam.mode==='engine') sr.tg.hood=1; sr.cam.auto=false; sr.cam.look=0; sr.cam.lookP=0;
      spin=(Math.random()<0.5?-1:1)*(0.12+Math.random()*0.3); tDist=4.6+Math.random()*5; tPitch=0.02+Math.random()*0.5; sr.cam.yaw=0.7; sr.turn=Math.random()*6.283;
      if(sr.eng.type!==o.power) sr.eng.setType(o.power);
      setTimeout(shuffle,9000+Math.random()*5000);
    };
    shuffle();
    const f0=sr.frame.bind(sr);
    sr.frame=dt=>{ dt0+=dt; sr.turn+=dt*spin; sr.cam.dist+=(tDist-sr.cam.dist)*Math.min(1,dt*0.8); sr.cam.pitch+=(tPitch-sr.cam.pitch)*Math.min(1,dt*0.8);
      if(sr.cam.mode==='cockpit') sr.cam.look=0.5*Math.sin(dt0*0.35); sr.tg.rev=dt0%5>4.2?0.7:0; f0(dt); };
  }
  // orbit / look around with drag, zoom with wheel / pinch
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ drag=[e.clientX,e.clientY]; });
  addEventListener('pointerup',()=>drag=null);
  addEventListener('pointermove',e=>{ if(!drag) return; const dx=(e.clientX-drag[0])/innerWidth, dy=(e.clientY-drag[1])/innerHeight; drag=[e.clientX,e.clientY];
    if(sr.cam.mode==='cockpit'){ sr.cam.look-=dx*3; sr.cam.lookP=Math.max(-0.8,Math.min(0.8,sr.cam.lookP-dy*2)); }
    else { sr.turn+=dx*4; sr.cam.pitch=Math.max(0.02,Math.min(1.2,sr.cam.pitch+dy*2)); } });
  cv.addEventListener('wheel',e=>{ const base=sr.F&&sr.F.kind?{drone:4.6,boat:13,galleon:52,pilot:3.4,alien:3.6,moto:4,hover:12,sub:10,ufo:36,chrono:6,starship:(sr.F.cfg&&sr.F.cfg.view&&sr.F.cfg.view!=='esterno'?30:190)}[sr.F.kind]:7.2; sr.cam.dist=Math.max(base*0.55,Math.min(base*2,sr.cam.dist*(1+e.deltaY*0.001))); });
  if(q.has('vehicle')) pickV(q.get('vehicle'));
  if(q.has('shot')){
    for(const k of ['hood','doors']) if(q.has(k)) { sr.tg[k]=1; sr.st[k==='doors'?'doorL':'hood']=1; if(k==='doors') sr.st.doorR=1; }
    if(q.has('mode')) sr.cam.mode=q.get('mode');
    if(q.has('steer')){ sr.st.wheelSteer=0.5; sr.st.steerWheel=2.4; }
    if(q.has('yaw')) sr.cam.yaw=parseFloat(q.get('yaw')); if(q.has('pitch')) sr.cam.pitch=parseFloat(q.get('pitch')); if(q.has('dist')) sr.cam.dist=parseFloat(q.get('dist'));
    for(const k of ['kit','livery','brakes']) if(q.has(k)){ C[k]=+q.get(k); } for(const k of ['rim','rimcol','stripe']) if(q.has(k)) C[k]=q.get(k); if(q.has('text')) C.text=q.get('text'); if(q.has('hand')) sr.tg.hand=1;
    if(q.has('fly')){ sr.tg.fly=1; sr.flyK=1; }
    if(q.has('roof')){ sr.tg.roof=sr.st.roof=parseFloat(q.get('roof')); }
    if(q.has('tgt')) sr.cam.tgt=q.get('tgt').split(',').map(parseFloat);
    if(q.has('specs')) $('specs').classList.add('open');
    sr.cam.auto=false;
    if(q.has('fx')){ const fx=q.get('fx'), M=CarRenderUtil.RY(0), tp=EngineFX.tipsFrom(M); sr.eng.setType(o.power); const stp=th=>{ sr.eng.update(1/60,{free:true,throttle:th}); sr.fx.update(1/60,tp.tips,tp.dir,[0,0,0],sr.eng,tp.hubs); };
      for(let i=0;i<70;i++) stp(1); for(let i=0;i<4;i++) stp(0); if(fx==='smoke') for(let i=0;i<60;i++) stp(0); else for(let i=0;i<60&&sr.fx.flameN<8;i++) stp(0); sr.turn=0; }
    sr.frame(0.001); window.__done=true; return;
  }
  let prev=performance.now();
  function loop(now){ const dt=Math.min(0.05,(now-prev)/1000); prev=now; sr.frame(dt); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
