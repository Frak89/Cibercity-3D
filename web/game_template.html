<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Cybercity 3D — NEON RUN</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Consolas,monospace;color:#ecfcff;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;color:#ff6177}
  .tb{position:fixed;bottom:4vmin;width:16vmin;height:16vmin;border:2px solid rgba(0,255,226,.5);border-radius:50%;
      background:rgba(7,11,19,.35);color:#ecfcff;font:bold 3vmin monospace;display:none;align-items:center;justify-content:center;user-select:none}
  body.touch .tb{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>
<div class="tb" id="tl" style="left:3vmin">◀</div>
<div class="tb" id="tr" style="left:21vmin">▶</div>
<div class="tb" id="tg" style="right:3vmin;bottom:24vmin">GAS</div>
<div class="tb" id="tbk" style="right:21vmin">FRENO</div>
<div class="tb" id="th" style="right:39vmin">DRIFT</div>
<div class="tb" id="tn" style="right:3vmin;bottom:44vmin">N₂O</div>
<div class="tb" id="tv" style="right:39vmin;bottom:24vmin">VISTA</div>
<div id="err"></div>
<script>/*SHADERS*/</script>
<script>/*ENGINE*/</script>
<script>/*CARHD*/</script>
<script>/*CARRENDER*/</script>
<script>/*GAME*/</script>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  let o={palette:'neon',weather:'',paint:'nero',seed:2077,help:true};
  try{Object.assign(o,JSON.parse(localStorage.getItem('neonrun')||'{}'));}catch(e){}
  for(const k of ['palette','weather','paint']) if(q.has(k)) o[k]=q.get(k);
  const save=()=>{try{localStorage.setItem('neonrun',JSON.stringify(o));}catch(e){}};
  const cv=document.getElementById('c'), hud=document.getElementById('hud');
  let game;
  try{ game=new NeonRun.Game(cv,hud,Object.assign(o,{preserve:q.has('shot')})); }
  catch(e){ const er=document.getElementById('err'); er.style.display='flex'; er.textContent='Errore: '+e.message; console.error(e); return; }
  window.__game=game;
  if(q.has('view')) game.view=parseInt(q.get('view'));
  function resize(){ const s=Math.min(window.devicePixelRatio||1,2); cv.width=hud.width=Math.round(innerWidth*s); cv.height=hud.height=Math.round(innerHeight*s); }
  addEventListener('resize',resize); resize();
  const inp={gas:false,brake:false,steer:0,hand:false,boost:false};
  const keys={};
  addEventListener('keydown',e=>{ keys[e.code]=true;
    if(e.code==='KeyC') game.view=(game.view+1)%NeonRun.VIEWS.length;
    if(e.code==='KeyP'){ const ks=Object.keys(CYBER_PALETTES); o.palette=ks[(ks.indexOf(o.palette)+1)%ks.length]; save(); }
    if(e.code==='KeyM'){ const ks=['',...Object.keys(CYBER_WEATHER)]; o.weather=ks[(ks.indexOf(o.weather)+1)%ks.length]; save(); }
    if(e.code==='KeyV'){ const ks=Object.keys(NeonRun.PAINTS); o.paint=ks[(ks.indexOf(o.paint)+1)%ks.length]; save(); }
    if(e.code==='KeyR'){ Object.assign(game.c,NeonRun.newCar()); }
    if(e.code==='KeyH'){ o.help=!o.help; save(); }
  });
  addEventListener('keyup',e=>{ keys[e.code]=false; });
  // touch buttons
  if('ontouchstart' in window) document.body.classList.add('touch');
  const tb={}; for(const id of ['tl','tr','tg','tbk','th','tn','tv']){ const el=document.getElementById(id);
    el.addEventListener('touchstart',e=>{e.preventDefault(); tb[id]=true; if(id==='tv') game.view=(game.view+1)%NeonRun.VIEWS.length;});
    el.addEventListener('touchend',e=>{e.preventDefault(); tb[id]=false;}); }
  function readInput(){
    inp.gas=keys.KeyW||keys.ArrowUp||tb.tg; inp.brake=keys.KeyS||keys.ArrowDown||tb.tbk;
    inp.steer=((keys.KeyA||keys.ArrowLeft||tb.tl)?1:0)-((keys.KeyD||keys.ArrowRight||tb.tr)?1:0);
    inp.hand=keys.Space||tb.th; inp.boost=keys.ShiftLeft||keys.ShiftRight||tb.tn;
  }
  // test mode: scripted driving then a single frame
  if(q.has('shot')){
    const T=parseFloat(q.get('t')||'3'), steer=parseFloat(q.get('steer')||'0');
    for(let i=0;i<T*30;i++){ const s={gas:true,brake:false,steer:steer,hand:q.has('drift')&&i>T*15,boost:q.has('boost')}; NeonRun.stepCar(game.c,s,1/30,game.city); game.cam.h=game.c.h; }
    game.frame(1/30,{gas:true,brake:q.has('brake'),steer:steer,hand:false,boost:false}); window.__done=true; return;
  }
  let prev=performance.now();
  function loop(now){ const dt=Math.min(0.05,(now-prev)/1000); prev=now; readInput(); game.frame(dt,inp); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
